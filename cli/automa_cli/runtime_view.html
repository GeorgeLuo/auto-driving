<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Automa</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #111820; color: #e5edf5; }
    main { max-width: 640px; margin: 12vh auto; padding: 24px; }
    p { color: #aab9c8; line-height: 1.6; }
    nav { display: grid; gap: 16px; margin-top: 32px; }
    a { display: block; padding: 24px; border: 1px solid #405165; border-radius: 8px; color: inherit; text-decoration: none; }
    a:hover, a:focus-visible { background: #203044; }
    a span { display: block; margin-top: 8px; color: #aab9c8; }
  </style>
</head>
<body>
  <main>
    <h1>Automa</h1>
    <p>Explore the running vehicle’s perception and memory.</p>
    <nav aria-label="Runtime views">
      <a href="/perception">Perception<span>Live camera frames and perception overlays.</span></a>
      <a href="/memory">Memory<span>Explore remembered keys and mapped values.</span></a>
    </nav>
  </main>
</body>
</html>
