<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Automa Decision</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      letter-spacing: -0.01em;
      --bg: #0a0a0a;
      --fg: #ededed;
      --muted: #8c8c8c;
      --line: rgba(255, 255, 255, 0.14);
      --green: #3ecf8e;
      --amber: #e6b325;
      --red: #ef6b6b;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
    }

    header {
      min-height: 40px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .identity, .runtime-status {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .product { font-size: 13px; font-weight: 500; white-space: nowrap; }
    .vehicle, #statusText {
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .vehicle { font-family: var(--mono); }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--amber);
      flex: 0 0 auto;
    }

    .status-dot.live { background: var(--green); }
    .status-dot.stale { background: var(--amber); }
    .status-dot.error { background: var(--red); }

    button, a.nav, span.nav {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 3px 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      font-size: 11px;
      line-height: 1.35;
      text-decoration: none;
    }

    button:hover, a.nav:hover, a.nav:focus-visible {
      background: rgba(255, 255, 255, 0.05);
      color: var(--fg);
    }

    span.nav, span.nav.unavailable { cursor: default; color: #6a6a6a; }

    button:focus-visible, a.nav:focus-visible {
      outline: 1px solid rgba(255, 255, 255, 0.45);
      outline-offset: 1px;
    }

    main {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 22rem);
      grid-template-rows: minmax(0, 1fr);
      overflow: hidden;
    }

    .visual {
      min-width: 0;
      min-height: 0;
      padding: 8px;
      background: #050505;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .stage {
      position: relative;
      display: inline-block;
      max-width: 100%;
      max-height: 100%;
      line-height: 0;
    }

    .stage img {
      display: block;
      max-width: 100%;
      max-height: min(100%, calc(100vh - 64px));
      width: auto;
      height: auto;
    }

    .stage canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .empty {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      text-align: center;
    }

    aside {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      border-left: 1px solid var(--line);
      background: var(--bg);
    }

    .panel { padding: 10px 12px; border-bottom: 1px solid var(--line); }

    h2 {
      margin: 0 0 8px;
      font-size: 10px;
      line-height: 1.2;
      text-transform: uppercase;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: rgba(140, 140, 140, 0.9);
    }

    .metrics {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 5px 16px;
      margin: 0;
      font-size: 12px;
    }

    .metrics dt { color: var(--muted); }
    .metrics dd {
      margin: 0;
      color: var(--fg);
      font-family: var(--mono);
      font-size: 12px;
      text-align: right;
      overflow-wrap: break-word;
    }

    .run-list, .thing-list { display: grid; gap: 6px; color: var(--muted); font-size: 12px; }

    .run, .thing {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 8px;
      background: transparent;
      overflow-wrap: anywhere;
    }

    .run {
      display: grid;
      grid-template-columns: 8px minmax(0, 1fr);
      column-gap: 8px;
      align-items: start;
    }

    .run::before {
      content: "";
      width: 6px;
      height: 6px;
      margin-top: 4px;
      border-radius: 50%;
      background: #3a3a3a;
      grid-row: 1 / span 2;
    }

    .run > div { grid-column: 2; }
    .thing.marked {
      display: grid;
      grid-template-columns: 8px minmax(0, 1fr);
      column-gap: 8px;
      align-items: start;
    }
    .thing.marked::before {
      content: "";
      width: 6px;
      height: 6px;
      margin-top: 4px;
      border-radius: 50%;
      background: var(--mark, #3a3a3a);
      grid-row: 1 / span 2;
    }
    .thing.marked > div { grid-column: 2; }
    .run.selected, .thing.selected {
      border-color: rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.06);
    }
    .run > div:first-of-type, .thing > div:first-of-type { color: var(--fg); font-size: 12px; }
    .run.ok::before, .run.active::before { background: var(--green); }
    .run.error::before, .run.unavailable::before { background: var(--red); }
    .run.inactive::before, .run.missing_input::before, .run.incompatible::before, .run.stale::before {
      background: var(--amber);
    }
    .secondary { color: var(--muted); font-size: 11px; margin-top: 2px; }

    details summary { cursor: pointer; color: var(--muted); font-size: 11px; font-weight: 500; }
    details summary:hover { color: var(--fg); }

    pre:empty { display: none; }

    pre {
      margin: 8px 0 0;
      padding: 8px;
      max-height: 280px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #111111;
      color: var(--fg);
      font: 11px/1.45 var(--mono);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    @media (max-width: 820px) {
      body { height: auto; display: block; }
      header { align-items: flex-start; }
      .runtime-status { flex-wrap: wrap; justify-content: flex-end; }
      main {
        height: auto;
        min-height: calc(100vh - 48px);
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: auto;
        overflow: visible;
      }
      .visual { min-height: 52vh; }
      .stage img { max-height: 65vh; }
      aside { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
    }
  </style>
</head>
<body>
  <header>
    <div class="identity">
      <span class="product">Decision</span>
      <span class="vehicle" id="vehicle">waiting</span>
    </div>
    <div class="runtime-status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Connecting</span>
      <a class="nav" href="/">Automa</a>
      <a class="nav" href="/perception">Perception</a>
      <a class="nav" href="/memory">Memory</a>
      <button type="button" id="pauseButton">Pause</button>
    </div>
  </header>

  <main>
    <section class="visual" aria-label="Current decision frame">
      <div class="empty" id="emptyState">Waiting for an accepted decision cycle</div>
      <div class="stage" id="stage" hidden>
        <img id="frame" alt="Exact camera image for the displayed decision cycle">
        <canvas id="overlay" aria-hidden="true"></canvas>
      </div>
    </section>

    <aside>
      <section class="panel">
        <h2>Cycle</h2>
        <dl class="metrics" id="cycleMetrics"></dl>
      </section>

      <section class="panel">
        <h2>Authority</h2>
        <dl class="metrics" id="authorityMetrics"></dl>
      </section>

      <section class="panel" id="hostTelemetry" aria-label="Host telemetry separate observation">
        <h2>Telemetry</h2>
        <div class="secondary" id="hostTelemetryStatus">unavailable</div>
        <pre id="hostTelemetryData"></pre>
      </section>

      <section class="panel">
        <h2>Candidates</h2>
        <div class="run-list" id="candidates"></div>
      </section>

      <section class="panel">
        <h2>Findings</h2>
        <div class="thing-list" id="things"></div>
      </section>

      <section class="panel">
        <details>
          <summary>Published data</summary>
          <pre id="rawData"></pre>
        </details>
      </section>
    </aside>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    let generation = params.get("generation");
    const frameImage = document.getElementById("frame");
    const canvas = document.getElementById("overlay");
    const context = canvas.getContext("2d");
    const stage = document.getElementById("stage");
    const emptyState = document.getElementById("emptyState");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const pauseButton = document.getElementById("pauseButton");
    const vehicleEl = document.getElementById("vehicle");
    let latest = null;
    let paused = false;
    let refreshing = false;
    let loadedImageUrl = null;
    let refreshToken = 0;
    const palette = ["#00d084", "#ffb000", "#ff5a5f", "#4ea5ff", "#d678ff", "#f46f36", "#12b8b0"];

    function colorFor(value) {
      let hash = 0;
      for (const char of String(value)) hash = ((hash << 5) - hash + char.charCodeAt(0)) | 0;
      return palette[Math.abs(hash) % palette.length];
    }

    function setStatus(text, mode) {
      statusText.textContent = text;
      statusDot.className = `status-dot ${mode || ""}`;
    }

    function appendMetric(container, name, value) {
      const term = document.createElement("dt");
      term.textContent = name;
      const detail = document.createElement("dd");
      detail.textContent = value ?? "unknown";
      container.append(term, detail);
    }

    function commandText(command) {
      if (!command) return "none";
      return `steer ${command.steering} / throttle ${command.throttle}`;
    }

    function decisionPlan() {
      const decision = latest?.decision || {};
      if (decision.plan_summary && typeof decision.plan_summary === "object") {
        return decision.plan_summary;
      }
      const plan = decision.cycle?.plan;
      return plan && typeof plan === "object" ? plan : {};
    }

    function selectedCandidate() {
      const plan = decisionPlan();
      const selected = plan.selected_proposal_id;
      const candidates = Array.isArray(plan.candidates) ? plan.candidates : [];
      return candidates.find((candidate) => candidate.proposal_id === selected) || candidates[0] || null;
    }

    function evidenceItems() {
      const records = latest?.evidence?.records;
      return Array.isArray(records) ? records : [];
    }

    function primaryRecordIds() {
      const refs = selectedCandidate()?.source_refs;
      return new Set((Array.isArray(refs) ? refs : []).map((ref) => String(ref.id || "")));
    }

    function evidenceRecords() {
      return evidenceItems().filter((item) => item?.status === "available" && item?.record)
        .map((item) => item.record).filter((record) => {
        const location = record?.location;
        return record?.kind !== "signal" && record?.kind !== "sensor_frame" &&
          location?.frame === "image" && normalizedBox(location);
      });
    }

    function clampNorm(value) {
      return Math.max(0, Math.min(1, Number(value)));
    }

    function normalizedBox(location) {
      const raw = location?.bbox_xyxy_norm;
      if (!Array.isArray(raw) || raw.length !== 4) return null;
      const values = raw.map(Number);
      if (!values.every(Number.isFinite)) return null;
      const [x1, y1, x2, y2] = values.map(clampNorm);
      return x2 > x1 && y2 > y1 ? [x1, y1, x2, y2] : null;
    }

    function drawOverlays() {
      if (!frameImage.naturalWidth || !latest) return;
      canvas.width = frameImage.naturalWidth;
      canvas.height = frameImage.naturalHeight;
      context.clearRect(0, 0, canvas.width, canvas.height);
      const primary = primaryRecordIds();
      context.font = "14px ui-sans-serif, system-ui, sans-serif";
      for (const record of evidenceRecords()) {
        const box = normalizedBox(record.location);
        if (!box) continue;
        const [x1, y1, x2, y2] = box;
        const x = x1 * canvas.width;
        const y = y1 * canvas.height;
        const width = (x2 - x1) * canvas.width;
        const height = (y2 - y1) * canvas.height;
        const isPrimary = primary.has(String(record.record_id || ""));
        const color = isPrimary ? "#ffb000" : colorFor(String(record.kind || "unknown"));
        context.fillStyle = `${color}22`;
        context.strokeStyle = color;
        context.lineWidth = Math.max(isPrimary ? 4 : 2, canvas.width / 320);
        context.fillRect(x, y, width, height);
        context.strokeRect(x, y, width, height);
        const label = `${isPrimary ? "selected " : ""}${record.kind || "evidence"} ${record.location?.zone || ""}`.trim();
        const metrics = context.measureText(label);
        const labelY = Math.max(0, y - 18);
        context.fillStyle = color;
        context.fillRect(x, labelY, metrics.width + 10, 18);
        context.fillStyle = "#101214";
        context.fillText(label, x + 5, labelY + 14);
      }
    }

    function renderData() {
      const identity = latest.identity || {};
      const decision = latest.decision || {};
      const cycle = decision.cycle || {};
      const plan = decisionPlan();
      const authority = latest.authority || {};
      const application = decision.application || {};
      const hostTelemetry = latest.host_telemetry || null;
      const candidate = selectedCandidate();
      const primary = primaryRecordIds();
      vehicleEl.textContent = identity.vehicle_id || "unknown vehicle";

      const cycleMetrics = document.getElementById("cycleMetrics");
      cycleMetrics.replaceChildren();
      appendMetric(cycleMetrics, "Frame", latest.current_image?.frame_id);
      appendMetric(cycleMetrics, "Status", cycle.action?.status || latest.status);
      appendMetric(cycleMetrics, "Proposal", candidate?.reason || plan.status || "—");
      appendMetric(cycleMetrics, "Freshness", candidate?.freshness || candidate?.lifecycle || "—");
      appendMetric(cycleMetrics, "Capture age", latest.freshness?.capture_age_ms != null ? `${latest.freshness.capture_age_ms} ms` : "—");

      const authorityMetrics = document.getElementById("authorityMetrics");
      authorityMetrics.replaceChildren();
      appendMetric(authorityMetrics, "Plugin", candidate?.plugin_id || "none");
      appendMetric(authorityMetrics, "Proposed", commandText(authority.proposed || candidate?.command));
      appendMetric(authorityMetrics, "Authorized", commandText(authority.authorized_output));
      appendMetric(authorityMetrics, "Authorized as proposed", authority.proposed_applied ? "true" : "false");
      const hostFrame = decision.frame_id || latest.current_image?.frame_id;
      appendMetric(
        authorityMetrics,
        "Host status",
        application.applied === true ? "applied" : application.applied === false ? "not applied" : "unavailable",
      );
      appendMetric(authorityMetrics, "Host reason", application.reason || "—");
      appendMetric(authorityMetrics, "Host frame", hostFrame ? `${hostFrame} (host reported)` : "unknown");
      appendMetric(authorityMetrics, "Host observed", commandText(application.applied == null ? null : application));

      document.getElementById("hostTelemetryStatus").textContent = hostTelemetry
        ? `${hostTelemetry.status || "unavailable"} · ${hostTelemetry.reason || ""}`
        : "unavailable";
      document.getElementById("hostTelemetryData").textContent = hostTelemetry
        ? JSON.stringify(hostTelemetry, null, 2)
        : "";

      const candidates = document.getElementById("candidates");
      candidates.replaceChildren();
      for (const rowCandidate of plan.candidates || []) {
        const row = document.createElement("div");
        const selected = rowCandidate.proposal_id === plan.selected_proposal_id;
        row.className = ["run", rowCandidate.lifecycle || "", selected ? "selected" : ""].filter(Boolean).join(" ");
        const name = document.createElement("div");
        name.textContent = rowCandidate.reason || rowCandidate.plugin_id || "unknown plugin";
        const detail = document.createElement("div");
        detail.className = "secondary";
        detail.textContent = `${rowCandidate.plugin_id || "unknown"} | ${rowCandidate.lifecycle || "unknown"} | ${commandText(rowCandidate.command)} | conf ${Number(rowCandidate.confidence || 0).toFixed(3)}`;
        row.append(name, detail);
        candidates.append(row);
      }
      if (!candidates.children.length) candidates.textContent = "No candidates";

      const things = document.getElementById("things");
      things.replaceChildren();
      for (const item of evidenceItems()) {
        if (item?.status !== "available" || !item?.record) {
          const unavailable = document.createElement("div");
          unavailable.className = "thing";
          const name = document.createElement("div");
          name.textContent = `${item?.record_id || item?.origin?.observed_id || "evidence"} · unavailable`;
          const detail = document.createElement("div");
          detail.className = "secondary";
          detail.textContent = item?.reason || "evidence_association_unavailable";
          unavailable.append(name, detail);
          things.append(unavailable);
          continue;
        }
        const record = item.record;
        const row = document.createElement("div");
        const isPrimary = primary.has(String(record.record_id || ""));
        row.className = isPrimary ? "thing marked selected" : "thing marked";
        row.style.setProperty("--mark", isPrimary ? "#ffb000" : colorFor(String(record.kind || "unknown")));
        const name = document.createElement("div");
        name.textContent = `${isPrimary ? "selected · " : ""}${record.label || record.kind || "evidence"}`;
        const detail = document.createElement("div");
        detail.className = "secondary";
        detail.textContent = `${record.kind || "unknown"} | ${record.location?.frame || "unknown"}:${record.location?.zone || "unknown"} | ${Number(record.confidence || 0).toFixed(3)}`;
        row.append(name, detail);
        things.append(row);
      }
      if (!things.children.length) things.textContent = "No retained evidence";

      document.getElementById("rawData").textContent = JSON.stringify(latest, null, 2);
      drawOverlays();
    }

    function liveStatus(payload) {
      latest = payload;
      const cycle = payload?.decision?.cycle || {};
      const candidate = selectedCandidate();
      if (cycle.action?.status === "error") {
        return { text: `Live | ${cycle.action.reason || "error"}`, mode: "error" };
      }
      if (candidate?.reason) {
        return { text: `Live | ${candidate.reason.replaceAll("_", " ")}`, mode: "live" };
      }
      return { text: `Live | plan ${payload?.decision?.plan_summary?.status || cycle.action?.status || "idle"}`, mode: "stale" };
    }

    function nonExpiredPayload(payload, now = Date.now()) {
      const freshness = payload?.freshness || {};
      return Number.isInteger(freshness.published_at_ms) &&
        Number.isInteger(freshness.expires_at_ms) &&
        freshness.expires_at_ms >= freshness.published_at_ms &&
        now >= freshness.published_at_ms && now <= freshness.expires_at_ms;
    }

    // A worker that runs restaged proposals publishes a new generation; follow
    // it while the run and worker are the ones this page has been showing.
    function restagedGeneration(response, payload) {
      const shown = latest?.identity;
      const next = payload?.identity;
      return response.status === 409 && payload?.reason === "generation_mismatch" &&
        /^[0-9a-f]{64}$/.test(payload?.generation_id || "") &&
        shown && next && shown.run_id === next.run_id && shown.worker_pid === next.worker_pid
        ? payload.generation_id
        : null;
    }

    function supersededPayload(payload) {
      const incoming = payload?.freshness?.published_at_ms;
      const displayed = latest?.freshness?.published_at_ms;
      return Number.isInteger(incoming) && Number.isInteger(displayed) && incoming < displayed;
    }

    function loadDecisionImage(imageUrl) {
      return new Promise((resolve, reject) => {
        const candidate = new Image();
        const loaded = () => { cleanup(); resolve(candidate); };
        const failed = () => { cleanup(); reject(new Error("frame unavailable")); };
        const cleanup = () => {
          candidate.removeEventListener("load", loaded);
          candidate.removeEventListener("error", failed);
        };
        candidate.addEventListener("load", loaded);
        candidate.addEventListener("error", failed);
        candidate.src = imageUrl;
      });
    }

    async function refresh() {
      if (paused || refreshing) return;
      refreshing = true;
      const requestToken = ++refreshToken;
      try {
        if (!/^[0-9a-f]{64}$/.test(generation || "")) {
          throw new Error("this page needs a producer generation");
        }
        const response = await fetch("/api/decision/latest?generation=" + encodeURIComponent(generation), { cache: "no-store" });
        const payload = await response.json();
        const restaged = restagedGeneration(response, payload);
        if (restaged) {
          generation = restaged;
          history.replaceState(null, "", "?" + new URLSearchParams({ generation }));
          throw new Error("decision restaged; following its generation");
        }
        if (!response.ok || payload.status !== "current" || payload.generation_id !== generation) {
          throw new Error(payload.reason || `HTTP ${response.status}`);
        }
        if (supersededPayload(payload)) return;
        if (!nonExpiredPayload(payload)) throw new Error("decision payload expired");
        const imageUrl = payload.current_image?.url;
        if (!imageUrl) throw new Error("exact decision image is unavailable");
        if (imageUrl !== loadedImageUrl) {
          await loadDecisionImage(imageUrl);
        }
        if (requestToken !== refreshToken || paused) return;
        if (!nonExpiredPayload(payload, Date.now()) || supersededPayload(payload)) {
          throw new Error("decision payload expired or superseded");
        }
        if (imageUrl !== loadedImageUrl) {
          frameImage.src = imageUrl;
          loadedImageUrl = imageUrl;
        }
        latest = payload;
        renderData();
        const status = liveStatus(payload);
        setStatus(status.text, status.mode);
      } catch (error) {
        if (requestToken !== refreshToken) return;
        if (latest !== null && loadedImageUrl !== null) {
          setStatus(`Frozen/stale snapshot | ${error.message}`, "stale");
        } else {
          setStatus(`Waiting: ${error.message}`, "error");
        }
      } finally {
        refreshing = false;
      }
    }

    frameImage.addEventListener("load", () => {
      emptyState.hidden = true;
      stage.hidden = false;
      drawOverlays();
    });
    pauseButton.addEventListener("click", () => {
      paused = !paused;
      pauseButton.textContent = paused ? "Resume" : "Pause";
      const hasSnapshot = latest !== null && loadedImageUrl !== null;
      const pausedStatus = hasSnapshot ? "Paused | frozen snapshot" : "Paused | waiting for snapshot";
      setStatus(paused ? pausedStatus : "Live", paused && hasSnapshot ? "stale" : "live");
      if (!paused) refresh();
    });
    window.addEventListener("resize", drawOverlays);

    refresh();
    setInterval(refresh, 200);
  </script>
</body>
</html>
