name: Deterministic tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-quality.txt
      - run: python3 -m pip install -r requirements-quality.txt
      - run: python3 -m scripts.validation.check

  qca:
    name: QCA inspection (informational)
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-quality.txt
      - run: python3 -m pip install -r requirements-quality.txt
      - name: Inspect the PR change
        run: |
          base=$(git merge-base "$PR_BASE" "$PR_HEAD")
          python3 -m scripts.validation.qca_summary --base "$base" --head "$PR_HEAD" --output "$RUNNER_TEMP/qca"
          cat "$RUNNER_TEMP/qca/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Report an inspection failure
        if: failure()
        run: echo 'QCA inspection failed; see the job log. This is informational.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qca-inspection
          path: ${{ runner.temp }}/qca/
          retention-days: 14

  test:
    name: Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTOMA_TEST_LIVE_SIM: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            requirements-quality.txt

      - name: Install test dependencies
        run: python3 -m pip install -r requirements-test.txt

      - name: Check tests for undefined names
        run: |
          if python3 -m pyflakes tests | grep "undefined name"; then exit 1; fi

      - name: Check for retired vocabulary
        run: |
          if git grep -n -i snapshot -- ':!docs/deprecated' ':!.github/workflows/tests.yml'; then exit 1; fi

      - name: Run deterministic tests with coverage
        run: |
          python3 -m coverage run tests/run.py
          python3 -m coverage combine

      - name: Publish informational coverage
        run: |
          python3 -m coverage report
          python3 -m coverage report --format=markdown --skip-covered >> "$GITHUB_STEP_SUMMARY"
