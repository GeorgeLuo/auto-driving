<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plugin stack · Automa</title>
<style>
  :root {
    color-scheme: dark;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0a0a0a;
    color: #ededed;
    --muted: #8c8c8c;
    --line: rgba(255, 255, 255, 0.14);
    --amber: #e6b325;
    --red: #ef6b6b;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  body { margin: 0; background: #0a0a0a; letter-spacing: -0.01em; }
  main { max-width: 1200px; margin: 28px auto; padding: 16px; }
  a.nav {
    display: inline-flex;
    align-items: center;
    min-height: 24px;
    margin-bottom: 16px;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 3px 8px;
    color: var(--muted);
    font-size: 11px;
    text-decoration: none;
  }
  a.nav:hover { background: rgba(255, 255, 255, 0.05); color: #ededed; }
  h1 { margin: 0; font-size: 13px; font-weight: 500; }
  #status { margin: 8px 0 0; color: var(--red); font-size: 12px; }
  .pipeline { display: flex; align-items: flex-start; gap: 8px; margin-top: 14px; overflow-x: auto; padding-bottom: 4px; }
  .pipeline.stale .step { opacity: 0.6; }
  .step { flex: 1 1 0; min-width: 140px; border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
  .step h2 { margin: 0 0 8px; color: var(--muted); font-size: 11px; font-weight: 500; }
  .flow { align-self: center; color: var(--muted); font-size: 12px; }
  ol { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
  li { padding: 6px 8px; border-radius: 4px; font-size: 12px; overflow-wrap: anywhere; }
  li.plugin { background: rgba(255, 255, 255, 0.05); font-family: var(--mono); }
  li.note { color: var(--muted); }
  li.note.unknown { color: var(--amber); }
</style>
<main>
  <a class="nav" href="/">Automa</a>
  <h1>Plugin stack</h1>
  <p id="status" role="alert" hidden></p>
  <div class="pipeline" id="pipeline"></div>
</main>
<script src="/plugin_feed.js"></script>
<script>
  const PLUGIN_STEPS = __PLUGIN_STEPS__;
  const pipeline = document.getElementById('pipeline');
  const stacks = {};
  let drawn = false;
  PLUGIN_STEPS.forEach((step, index) => {
    if (index) {
      const flow = document.createElement('span');
      flow.className = 'flow';
      flow.ariaHidden = 'true';
      flow.textContent = '→';
      pipeline.appendChild(flow);
    }
    const section = document.createElement('section');
    section.className = 'step';
    section.dataset.step = step;
    const heading = document.createElement('h2');
    heading.textContent = step;
    const stack = document.createElement('ol');
    stack.ariaLabel = step + ' plugins';
    section.append(heading, stack);
    pipeline.appendChild(section);
    stacks[step] = stack;
  });
  function note(text, className) {
    const item = document.createElement('li');
    item.className = 'note' + (className ? ' ' + className : '');
    item.textContent = text;
    return item;
  }
  // Each step lists its applied plugins top to bottom in the order they run.
  function render(catalog) {
    for (const step of PLUGIN_STEPS) {
      const applied = appliedPlugins(catalog, step);
      const items = applied === null ? [note('Unknown', 'unknown')]
        : !applied.length ? [note('No plugins')]
        : applied.map(plugin => {
          const item = document.createElement('li');
          item.className = 'plugin';
          item.dataset.pluginId = plugin.id;
          item.textContent = plugin.id;
          item.title = plugin.metadata?.revision ? 'uploaded revision ' + plugin.metadata.revision : 'packaged';
          return item;
        });
      stacks[step].replaceChildren(...items);
    }
    drawn = true;
  }
  followPluginCatalog({
    view: pipeline, status: document.getElementById('status'), render, markStale: () => drawn,
  });
</script>
</html>
