<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>decision-combined-v0 · shadow observe-only</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    body { margin: 0; background: #101419; color: #e8edf2; line-height: 1.45; }
    main { max-width: 1180px; margin: 0 auto; padding: 1rem; }
    h1, h2, h3 { line-height: 1.2; }
    h1 { margin: 0; font-size: clamp(1.2rem, 3vw, 1.8rem); }
    h2 { margin: 0 0 .7rem; font-size: 1rem; }
    h3 { margin: .8rem 0 .4rem; font-size: .9rem; }
    p { margin: .35rem 0; }
    code, pre, .fact-value { overflow-wrap: anywhere; }
    pre { white-space: pre-wrap; margin: 0; padding: .7rem; background: #171d24; border: 1px solid #303a45; border-radius: .35rem; }
    header, section { margin-bottom: 1rem; padding: .9rem; background: #141a20; border: 1px solid #303a45; border-radius: .45rem; }
    header { border-left: .35rem solid #e7a83b; }
    .eyebrow { margin: 0 0 .35rem; color: #9fb2c4; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; }
    .observe { color: #ffd37a; font-weight: 700; }
    .status { margin-top: .7rem; padding: .65rem; border: 1px solid #66788a; border-radius: .35rem; }
    .status[data-state="live"] { border-color: #65c18c; }
    .status[data-state="error"] { border-color: #ed8b8b; }
    .status::before { content: "Status: "; font-weight: 700; }
    .black-box-overview { border-color: #65c18c; }
    .section-intro { margin: -.2rem 0 .8rem; color: #afbdc9; }
    .black-box-flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .65rem; }
    .black-box-card { min-width: 0; padding: .7rem; background: #171d24; border: 1px solid #303a45; border-radius: .35rem; }
    .black-box-card[data-kind="input"] { border-top: .25rem solid #72a7ff; }
    .black-box-card[data-kind="decision"] { border-top: .25rem solid #e7a83b; }
    .black-box-card[data-kind="output"] { border-top: .25rem solid #65c18c; }
    .black-box-card h3 { margin-top: 0; }
    .black-box-card .facts { grid-template-columns: 1fr; }
    .black-box-card .fact { background: #141a20; }
    .memory-records { margin: .7rem 0 0; padding-left: 1.1rem; color: #d3dde5; }
    .memory-records li { margin: .3rem 0; overflow-wrap: anywhere; }
    .candidate-list { display: grid; gap: .75rem; }
    .candidate-card { padding: .7rem; background: #171d24; border: 1px solid #303a45; border-radius: .35rem; }
    .candidate-card .facts { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
    .candidate-card details { margin-top: .7rem; }
    .candidate-card details > summary { cursor: pointer; color: #c7d4df; }
    .supporting-details { margin-bottom: 1rem; padding: .8rem .9rem; background: #141a20; border: 1px solid #303a45; border-radius: .45rem; }
    .supporting-details > summary { cursor: pointer; color: #c7d4df; font-weight: 700; }
    .supporting-details > summary::marker { color: #e7a83b; }
    .supporting-details > section { margin: .8rem 0 0; padding: 0; background: transparent; border: 0; }
    .supporting-details > section:last-child { margin-bottom: 0; }
    .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: .55rem .9rem; }
    .fact { min-width: 0; padding: .45rem; background: #171d24; border-radius: .3rem; }
    .fact-label { display: block; color: #9fb2c4; font-size: .78rem; }
    .fact-value { display: block; margin-top: .15rem; }
    .warning { border-left: .3rem solid #e7a83b; padding-left: .7rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 1rem; }
    .pane { min-width: 0; padding: .7rem; background: #171d24; border: 1px solid #303a45; border-radius: .35rem; }
    .media-stage { position: relative; width: 100%; max-height: 70vh; overflow: hidden; background: #090b0d; border: 1px solid #45525f; border-radius: .25rem; }
    .media-stage img { display: block; width: 100%; height: auto; max-height: 70vh; object-fit: contain; }
    .media-stage svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .bbox { fill: none; stroke: #ffd166; stroke-width: 3; vector-effect: non-scaling-stroke; }
    .polygon { fill: #ffd16633; stroke: #65c18c; stroke-width: 3; vector-effect: non-scaling-stroke; }
    .unavailable { color: #ffb4b4; }
    .subtle { color: #afbdc9; }
    .empty { padding: .6rem; border: 1px dashed #66788a; border-radius: .3rem; }
    @media (max-width: 900px) { .black-box-flow { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 560px) { main { padding: .65rem; } header, section { padding: .7rem; } .black-box-flow { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Automa M006 D2 · shadow / observe-only</p>
      <h1 id="decision-combined-v0">decision-combined-v0</h1>
      <p>This view reports an accepted shadow decision. It has no controls and sends no vehicle commands.</p>
      <p id="status" class="status" role="status" aria-live="polite" data-state="error">Unavailable: a generation query is required.</p>
    </header>
    <div id="live-content" aria-live="off">
      <section class="empty"><p class="subtle">Live decision content is unavailable until a generation-bound response is accepted.</p></section>
    </div>
  </main>
  <script>
    (() => {
      "use strict";

      const statusNode = document.getElementById("status");
      const liveRoot = document.getElementById("live-content");
      const generationPattern = /^[0-9a-f]{64}$/;
      const pollDelayMs = 500;
      const transactionLimitMs = 2000;
      let generation = null;
      let transactionSerial = 0;
      let activeController = null;
      let pollTimer = null;
      let displayExpiryTimer = null;
      let displayedTransactionSerial = null;
      let currentObjectUrls = [];
      let wasHidden = document.visibilityState === "hidden";

      function element(tag, text, className) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined && text !== null) node.textContent = String(text);
        return node;
      }

      function setStatus(message, state) {
        statusNode.textContent = message;
        statusNode.dataset.state = state || "error";
      }

      function revokeObjectUrls(urls) {
        for (const url of urls || []) URL.revokeObjectURL(url);
      }

      function clearDisplayExpiry() {
        if (displayExpiryTimer) clearTimeout(displayExpiryTimer);
        displayExpiryTimer = null;
        displayedTransactionSerial = null;
      }

      function clearLive(message) {
        clearDisplayExpiry();
        revokeObjectUrls(currentObjectUrls);
        currentObjectUrls = [];
        const empty = element("section", null, "empty");
        empty.appendChild(element("p", message, "unavailable"));
        liveRoot.replaceChildren(empty);
        setStatus(message, "error");
      }

      function invalidate(message) {
        transactionSerial += 1;
        if (activeController) activeController.abort();
        clearLive(message);
      }

      function jsonText(value) {
        if (value === undefined) return "unavailable";
        try { return JSON.stringify(value, null, 2); }
        catch (_) { return "[unserializable value]"; }
      }

      function jsonSection(title, value) {
        const section = element("section");
        section.appendChild(element("h2", title));
        const pre = element("pre");
        pre.textContent = jsonText(value);
        section.appendChild(pre);
        return section;
      }

      function factsGrid(facts) {
        const grid = element("div", null, "facts");
        for (const [label, value] of facts) {
          const fact = element("div", null, "fact");
          fact.appendChild(element("span", label, "fact-label"));
          fact.appendChild(element("span", displayValue(value), "fact-value"));
          grid.appendChild(fact);
        }
        return grid;
      }

      function factsSection(title, facts) {
        const section = element("section");
        section.appendChild(element("h2", title));
        section.appendChild(factsGrid(facts));
        return section;
      }

      function detailsSection(title, children, open) {
        const details = element("details", null, "supporting-details");
        if (open) details.open = true;
        details.appendChild(element("summary", title));
        for (const child of (Array.isArray(children) ? children : [children])) {
          if (child) details.appendChild(child);
        }
        return details;
      }

      function pathValue(root, path) {
        let value = root;
        for (const key of path) {
          if (!value || typeof value !== "object") return undefined;
          value = value[key];
        }
        return value;
      }

      function displayValue(value) {
        if (value === undefined) return "unavailable";
        if (value === null) return "null";
        if (typeof value === "object") return jsonText(value);
        return String(value);
      }

      function commandSummary(command) {
        if (command === undefined) return "unavailable";
        if (command === null) return "null · no emitted command";
        return displayValue(command);
      }

      function envelopeSummary(envelope) {
        if (envelope === undefined) return "unavailable";
        if (envelope === null) return "null";
        if (typeof envelope !== "object") return displayValue(envelope);
        const status = envelope.status;
        const reason = envelope.reason;
        if (reason !== undefined && reason !== null && reason !== "") {
          return displayValue(status) + " · " + displayValue(reason);
        }
        return displayValue(status);
      }

      function blackBoxCard(kind, label, title, facts) {
        const card = element("article", null, "black-box-card");
        card.dataset.kind = kind;
        card.appendChild(element("p", label, "eyebrow"));
        card.appendChild(element("h3", title));
        card.appendChild(factsGrid(facts));
        return card;
      }

      function appendMemoryRecords(card, memory) {
        if (!memory || typeof memory !== "object") {
          card.appendChild(element("p", "Memory preview unavailable.", "unavailable"));
          return;
        }
        const records = memory.preview_records;
        if (!Array.isArray(records)) {
          card.appendChild(element("p", "Memory preview unavailable · reason=" + displayValue(memory.reason), "unavailable"));
          return;
        }
        if (!records.length) {
          card.appendChild(element("p", "No retained records.", "empty"));
        }
        if (records.length) {
          const list = element("ul", null, "memory-records");
          records.forEach((record, index) => {
            const details = element("details");
            const label = "record " + String(index + 1) + " · "
              + displayValue(pathValue(record, ["record_id"]));
            details.appendChild(element("summary", label));
            const pre = element("pre");
            pre.textContent = jsonText(record);
            details.appendChild(pre);
            const item = element("li");
            item.appendChild(details);
            list.appendChild(item);
          });
          card.appendChild(list);
        }
        card.appendChild(element("p", "Omitted from preview: " + displayValue(memory.omitted_record_count), "subtle"));
      }

      function blackBoxOverview(payload, decision, cycle) {
        const presentation = payload.presentation;
        const observation = pathValue(presentation, ["observation"]);
        const memory = pathValue(presentation, ["memory"]);
        const selected = pathValue(presentation, ["selected_candidate"]);
        const plan = pathValue(cycle, ["plan"]);
        const authority = pathValue(cycle, ["authority"]);
        const section = element("section", null, "black-box-overview");
        section.id = "decision-overview";
        section.appendChild(element("p", "PR execution path", "eyebrow"));
        section.appendChild(element("h2", "Decision black box"));
        section.appendChild(element("p", "Structured observation + memory snapshot → shadow proposal → authority result. Source images and raw records below are supporting evidence, not additional engine inputs. Read-only; no vehicle command is sent.", "section-intro"));
        const flow = element("div", null, "black-box-flow");
        const perceptionCard = blackBoxCard("input", "Input · structured observation", "Observation", [
          ["status", pathValue(observation, ["status"])],
          ["observation", pathValue(observation, ["frame_id"])],
          ["cycle frame", pathValue(decision, ["frame_id"])],
          ["raw image", "not an engine input"],
          ["reason", pathValue(observation, ["reason"])]
        ]);
        const memoryCard = blackBoxCard("input", "Input · memory snapshot", "Memory", [
          ["status", pathValue(memory, ["status"])],
          ["reason", pathValue(memory, ["reason"])],
          ["health", pathValue(memory, ["health"])],
          ["record count", pathValue(memory, ["record_count"])]
        ]);
        appendMemoryRecords(memoryCard, memory);
        flow.appendChild(perceptionCard);
        flow.appendChild(memoryCard);
        flow.appendChild(blackBoxCard("decision", "Decision · shadow proposal", "Selected result", [
          ["engine", pathValue(decision, ["engine_id"])],
          ["selector", pathValue(plan, ["selector_id"])],
          ["plan", pathValue(plan, ["status"])],
          ["selected proposal", pathValue(plan, ["selected_proposal_id"])],
          ["lifecycle", pathValue(selected, ["lifecycle"])],
          ["freshness", pathValue(selected, ["freshness"])],
          ["reason", pathValue(selected, ["reason"])],
          ["proposed command (including gear)", commandSummary(pathValue(authority, ["proposed"]))]
        ]));
        flow.appendChild(blackBoxCard("output", "Output · authority boundary", "Authorized result", [
          ["proposed_applied (shadow-only)", pathValue(authority, ["proposed_applied"])],
          ["proposed intent (including gear)", commandSummary(pathValue(authority, ["proposed"]))],
          ["authorized output (including gear)", commandSummary(pathValue(authority, ["authorized_output"]))],
          ["host observation", pathValue(payload, ["host_observation", "status"])]
        ]));
        section.appendChild(flow);
        return section;
      }

      function candidatesSection(plan) {
        const section = element("section");
        section.appendChild(element("h2", "Candidates · canonical cycle.plan.candidates"));
        const candidates = pathValue(plan, ["candidates"]);
        if (!Array.isArray(candidates)) {
          section.appendChild(element("p", "Candidates unavailable; the canonical plan is unavailable.", "unavailable"));
          return section;
        }
        if (!candidates.length) {
          section.appendChild(element("p", "No candidates were emitted by the canonical plan.", "empty"));
          return section;
        }
        const list = element("div", null, "candidate-list");
        candidates.forEach((candidate, index) => {
          const card = element("article", null, "candidate-card");
          card.appendChild(element("p", "Candidate " + String(index + 1), "eyebrow"));
          card.appendChild(factsGrid([
            ["plugin_id", pathValue(candidate, ["plugin_id"])],
            ["proposal_id", pathValue(candidate, ["proposal_id"])],
            ["lifecycle", pathValue(candidate, ["lifecycle"])],
            ["freshness", pathValue(candidate, ["freshness"])],
            ["confidence", pathValue(candidate, ["confidence"])],
            ["available", pathValue(candidate, ["available"])],
            ["reason", pathValue(candidate, ["reason"])],
            ["complete command (including gear)", commandSummary(pathValue(candidate, ["command"]))]
          ]));
          card.appendChild(detailsSection("Candidate detail · complete producer record", jsonSection("Canonical candidate", candidate)));
          list.appendChild(card);
        });
        section.appendChild(list);
        return section;
      }

      function finiteNormalized(value) {
        return typeof value === "number" && Number.isFinite(value) && value >= 0 && value <= 1;
      }

      function validGeometry(geometry) {
        if (!geometry || geometry.status !== "available" || geometry.coordinate_frame !== "image" || geometry.transform !== "normalized_source_image_to_display") return null;
        const bbox = geometry.bbox_xyxy_norm;
        const polygon = geometry.polygon_xy_norm;
        const validBbox = Array.isArray(bbox) && bbox.length === 4 && bbox.every(finiteNormalized) && bbox[0] < bbox[2] && bbox[1] < bbox[3];
        let validPolygon = Array.isArray(polygon) && polygon.length >= 3 && polygon.length <= 256 && polygon.every(point => Array.isArray(point) && point.length === 2 && point.every(finiteNormalized));
        if (validPolygon) {
          let area = 0;
          for (let i = 0; i < polygon.length; i += 1) {
            const a = polygon[i];
            const b = polygon[(i + 1) % polygon.length];
            area += a[0] * b[1] - b[0] * a[1];
          }
          validPolygon = Math.abs(area) > 0;
        }
        if (!validBbox && !validPolygon) return null;
        return { bbox: validBbox ? bbox : null, polygon: validPolygon ? polygon : null };
      }

      function geometryNote(geometry) {
        if (!geometry || geometry.status !== "available") return "Geometry unavailable: " + displayValue(pathValue(geometry, ["reason"]));
        if (!validGeometry(geometry)) return "Geometry unavailable: unsupported or invalid supplied geometry";
        return "Geometry: normalized source-image geometry; no cross-frame projection";
      }

      function appendGeometryFacts(pane, geometry) {
        pane.appendChild(element("p", geometryNote(geometry), geometry && geometry.status === "available" ? "subtle" : "unavailable"));
        if (geometry && geometry.coordinate_frame) pane.appendChild(element("p", "coordinate_frame=" + geometry.coordinate_frame));
      }

      function mediaPane(title, descriptor, geometry, assets, associationText, extraFacts) {
        const pane = element("article", null, "pane");
        pane.appendChild(element("h3", title));
        pane.appendChild(element("p", associationText === undefined ? "Association: unavailable" : displayValue(associationText), "subtle"));
        const sourceFacts = [
          ["status", pathValue(descriptor, ["status"])], ["reason", pathValue(descriptor, ["reason"])], ["image_id", pathValue(descriptor, ["image_id"])],
          ["sha256", pathValue(descriptor, ["sha256"])], ["frame_id", pathValue(descriptor, ["frame_id"])], ["frame_index", pathValue(descriptor, ["frame_index"])],
          ["observation_id", pathValue(descriptor, ["observation_id"])], ["captured_at_ms", pathValue(descriptor, ["captured_at_ms"])],
          ["dimensions", pathValue(descriptor, ["width_px"]) !== undefined && pathValue(descriptor, ["width_px"]) !== null && pathValue(descriptor, ["height_px"]) !== undefined && pathValue(descriptor, ["height_px"]) !== null ? pathValue(descriptor, ["width_px"]) + " × " + pathValue(descriptor, ["height_px"]) : undefined]
        ];
        for (const fact of (extraFacts || [])) sourceFacts.push(fact);
        pane.appendChild(factsSection("Source facts", sourceFacts));
        if (!descriptor || descriptor.status !== "available") {
          pane.appendChild(element("p", "Image unavailable: " + displayValue(pathValue(descriptor, ["reason"])), "unavailable"));
          appendGeometryFacts(pane, geometry);
          return pane;
        }
        const asset = assets.get(descriptor.url);
        if (!asset) {
          pane.appendChild(element("p", "Image unavailable: transaction asset missing", "unavailable"));
          appendGeometryFacts(pane, geometry);
          return pane;
        }
        const stage = element("div", null, "media-stage");
        stage.style.aspectRatio = String(descriptor.width_px) + " / " + String(descriptor.height_px);
        const image = asset.image.cloneNode(false);
        image.alt = title + "; exact returned source image";
        stage.appendChild(image);
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "0 0 " + String(descriptor.width_px) + " " + String(descriptor.height_px));
        svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
        svg.setAttribute("aria-label", "Validated source-image geometry overlay");
        const shape = validGeometry(geometry);
        if (shape) {
          if (shape.bbox) {
            const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            rect.setAttribute("class", "bbox");
            rect.setAttribute("x", String(shape.bbox[0] * descriptor.width_px));
            rect.setAttribute("y", String(shape.bbox[1] * descriptor.height_px));
            rect.setAttribute("width", String((shape.bbox[2] - shape.bbox[0]) * descriptor.width_px));
            rect.setAttribute("height", String((shape.bbox[3] - shape.bbox[1]) * descriptor.height_px));
            svg.appendChild(rect);
          }
          if (shape.polygon) {
            const polygon = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
            polygon.setAttribute("class", "polygon");
            polygon.setAttribute("points", shape.polygon.map(point => (point[0] * descriptor.width_px) + "," + (point[1] * descriptor.height_px)).join(" "));
            svg.appendChild(polygon);
          }
        }
        stage.appendChild(svg);
        pane.appendChild(stage);
        appendGeometryFacts(pane, geometry);
        return pane;
      }

      function imageDescriptors(payload) {
        const descriptors = [];
        if (payload.current_image) descriptors.push(payload.current_image);
        for (const entry of Array.isArray(payload.evidence) ? payload.evidence : []) if (entry && entry.source_image) descriptors.push(entry.source_image);
        return descriptors.filter((descriptor, index, all) => descriptor && descriptor.status === "available" && typeof descriptor.url === "string" && all.findIndex(item => item && item.url === descriptor.url) === index);
      }

      function loadImage(descriptor, signal, objectUrls) {
        return fetch(descriptor.url, { cache: "no-store", signal }).then(response => {
          if (!response.ok) throw new Error("image_http_" + response.status);
          return response.blob();
        }).then(blob => new Promise((resolve, reject) => {
          const objectUrl = URL.createObjectURL(blob);
          objectUrls.push(objectUrl);
          const image = new Image();
          let settled = false;
          const finish = (error) => {
            if (settled) return;
            settled = true;
            if (error) reject(error); else resolve({ image, objectUrl });
          };
          image.onload = () => {
            const decoded = typeof image.decode === "function" ? image.decode() : Promise.resolve();
            decoded.then(() => finish()).catch(finish);
          };
          image.onerror = () => finish(new Error("image_decode_failed"));
          signal.addEventListener("abort", () => finish(new Error("transaction_aborted")), { once: true });
          image.src = objectUrl;
        }));
      }

      async function fetchTransaction(serial) {
        const controller = new AbortController();
        activeController = controller;
        const startedAt = performance.now();
        const objectUrls = [];
        let deadlineExpired = false;
        const expireTransaction = () => { deadlineExpired = true; controller.abort(); };
        let deadlineTimer = setTimeout(expireTransaction, transactionLimitMs);
        try {
          const url = "/api/decision/latest?generation=" + encodeURIComponent(generation);
          const response = await fetch(url, { cache: "no-store", signal: controller.signal });
          let payload = null;
          try { payload = await response.json(); } catch (_) { payload = null; }
          if (!response.ok) throw new Error(payload && payload.reason ? payload.reason : "http_" + response.status);
          if (!payload || (payload.status !== "current" && payload.status !== "partial")) throw new Error((payload && payload.reason) || "decision_unavailable");
          if (payload.generation_id !== generation) throw new Error("generation_mismatch");
          if (typeof payload.max_age_ms !== "number" || !Number.isFinite(payload.max_age_ms) || payload.max_age_ms <= 0 || typeof payload.served_at_ms !== "number" || !Number.isFinite(payload.served_at_ms) || typeof payload.expires_at_ms !== "number" || !Number.isFinite(payload.expires_at_ms)) throw new Error("freshness_invalid");
          const freshnessBudgetMs = payload.expires_at_ms - payload.served_at_ms;
          const freshnessRemainingMs = freshnessBudgetMs - (performance.now() - startedAt);
          if (freshnessBudgetMs <= 0) throw new Error("freshness_invalid");
          const transactionMs = transactionLimitMs - (performance.now() - startedAt);
          if (freshnessRemainingMs <= 0) throw new Error("decision_expired");
          if (transactionMs <= 0) throw new Error("timeout");
          clearTimeout(deadlineTimer);
          deadlineTimer = setTimeout(expireTransaction, Math.min(transactionMs, freshnessRemainingMs));
          const assets = new Map();
          await Promise.all(imageDescriptors(payload).map(async descriptor => assets.set(descriptor.url, await loadImage(descriptor, controller.signal, objectUrls))));
          if (serial !== transactionSerial || controller.signal.aborted) throw new Error("superseded");
          if (performance.now() - startedAt >= transactionLimitMs || freshnessBudgetMs - (performance.now() - startedAt) <= 0) throw new Error("decision_expired");
          return { payload, assets, objectUrls, freshnessBudgetMs, startedAt };
        } catch (error) {
          revokeObjectUrls(objectUrls);
          if (deadlineExpired || (error && error.name === "AbortError")) throw new Error("timeout");
          throw error;
        } finally {
          clearTimeout(deadlineTimer);
          if (activeController === controller) activeController = null;
        }
      }

      function renderPayload(result) {
        const payload = result.payload;
        const decision = payload.decision;
        const cycle = pathValue(decision, ["cycle"]);
        const plan = pathValue(cycle, ["plan"]);
        const authority = pathValue(cycle, ["authority"]);
        const source = pathValue(cycle, ["source"]);
        const fragment = document.createDocumentFragment();
        fragment.appendChild(blackBoxOverview(payload, decision, cycle));
        fragment.appendChild(candidatesSection(plan));
        fragment.appendChild(detailsSection("Supporting data · decision input envelope status", factsSection("Decision inputs · envelope status", [
          ["observation", envelopeSummary(pathValue(source, ["observation"]))],
          ["memory", envelopeSummary(pathValue(source, ["memory"]))],
          ["patterns", envelopeSummary(pathValue(source, ["patterns"]))],
          ["projections", envelopeSummary(pathValue(source, ["projections"]))],
          ["capabilities", envelopeSummary(pathValue(source, ["capabilities"]))],
          ["prior applied command", envelopeSummary(pathValue(source, ["prior_host_applied_command"]))]
        ])));
        fragment.appendChild(detailsSection("Supporting data · raw decision input envelopes", jsonSection("Decision inputs · raw envelopes", source)));
        fragment.appendChild(detailsSection("Supporting data · detailed decision result", factsSection("Decision result · detailed", [
          ["engine", pathValue(decision, ["engine_id"])], ["cycle status", pathValue(cycle, ["status"])], ["cycle reason", pathValue(cycle, ["reason"])],
          ["selector", pathValue(plan, ["selector_id"])], ["plan status", pathValue(plan, ["status"])], ["selected proposal", pathValue(plan, ["selected_proposal_id"])],
          ["selected candidate", pathValue(payload, ["presentation", "selected_candidate", "proposal_id"])],
          ["proposed command", commandSummary(pathValue(authority, ["proposed"]))]
        ])));
        fragment.appendChild(detailsSection("Supporting data · canonical plan and authority", [
          jsonSection("Canonical cycle.plan", plan),
          jsonSection("Canonical cycle.authority", authority)
        ]));
        const imageSection = element("section");
        imageSection.appendChild(element("h2", "Source evidence · current image and retained memory refs"));
        const imageGrid = element("div", null, "grid");
        imageGrid.appendChild(mediaPane("Current cycle image", payload.current_image, null, result.assets, "Association: current decision-cycle frame; this is not the fastest camera frame."));
        const evidence = Array.isArray(payload.evidence) ? payload.evidence : [];
        if (!evidence.length) imageGrid.appendChild(element("p", "No source refs were accepted for this cycle.", "empty"));
        evidence.forEach((entry, index) => {
          const label = "Retained source " + String(index + 1) + " · " + displayValue(pathValue(entry, ["association"])) + " · proposal=" + displayValue(pathValue(entry, ["proposal_id"]));
          const pane = mediaPane(label, pathValue(entry, ["source_image"]), pathValue(entry, ["geometry"]), result.assets, "Association: " + displayValue(pathValue(entry, ["association"])) + "; record_id=" + displayValue(pathValue(entry, ["record_id"])), [
            ["proposal_id", pathValue(entry, ["proposal_id"])], ["selected", pathValue(entry, ["selected"])],
            ["record_id", pathValue(entry, ["record_id"])], ["retained_age_ms", pathValue(entry, ["retained_age_ms"])],
            ["provenance", pathValue(entry, ["provenance"])]
          ]);
          pane.appendChild(detailsSection("Evidence record · source ref, provenance, and geometry", jsonSection("Canonical evidence entry", entry)));
          imageGrid.appendChild(pane);
        });
        imageSection.appendChild(imageGrid);
        fragment.appendChild(detailsSection("Supporting evidence · source images, retained refs, and geometry", imageSection));
        const hostFacts = factsSection("Host observation · separate from the decision", [
          ["status", pathValue(payload, ["host_observation", "status"])], ["reason", pathValue(payload, ["host_observation", "reason"])],
          ["observer", pathValue(payload, ["host_observation", "value", "observer"])],
          ["mode", pathValue(payload, ["host_observation", "value", "mode"])],
          ["user input", commandSummary(pathValue(payload, ["host_observation", "value", "user_input"]))],
          ["pilot output", commandSummary(pathValue(payload, ["host_observation", "value", "pilot_output"]))],
          ["host output", commandSummary(pathValue(payload, ["host_observation", "value", "host_output"]))],
          ["observed_at_ms", pathValue(payload, ["host_observation", "value", "observed_at_ms"])]
        ]);
        const hostRaw = jsonSection("Host observation · separate fact, not physical telemetry", payload.host_observation);
        fragment.appendChild(detailsSection("Supporting data · independent host observation", [hostFacts, hostRaw]));
        const publicationFacts = factsSection("Publication, identity, and freshness", [
          ["schema", payload.schema], ["view_id", payload.view_id], ["status", payload.status], ["reason", payload.reason], ["generation_id", payload.generation_id],
          ["cycle frame_id", pathValue(decision, ["frame_id"])], ["cycle frame_index", pathValue(decision, ["frame_index"])], ["cycle timestamp_ms", pathValue(decision, ["timestamp_ms"])],
          ["source timestamp_ms", pathValue(cycle, ["source", "timestamp_ms"])], ["published_at_ms", pathValue(decision, ["published_at_ms"])],
          ["served_at_ms", payload.served_at_ms], ["max_age_ms", payload.max_age_ms], ["expires_at_ms", payload.expires_at_ms], ["decision_sha256", payload.decision_sha256],
          ["vehicle_id", pathValue(payload, ["identity", "vehicle_id"])], ["run_id", pathValue(payload, ["identity", "run_id"])], ["worker_pid", pathValue(payload, ["identity", "worker_pid"])],
          ["activation_engine_id", pathValue(payload, ["identity", "activation_engine_id"])], ["activation_activated_at_ms", pathValue(payload, ["identity", "activation_activated_at_ms"])], ["activation_sha256", pathValue(payload, ["identity", "activation_sha256"])]
        ]);
        const rawDecision = jsonSection("Raw accepted decision (lossless display)", decision);
        const limits = jsonSection("View limits and refusal counters", payload.limits);
        fragment.appendChild(detailsSection("Supporting record · publication, identity, freshness, and raw decision", [publicationFacts, limits, rawDecision]));
        return fragment;
      }

      async function poll() {
        if (!generation) return;
        const serial = ++transactionSerial;
        try {
          const result = await fetchTransaction(serial);
          if (serial !== transactionSerial) { revokeObjectUrls(result.objectUrls); return; }
          const fragment = renderPayload(result);
          const remainingFreshnessMs = result.freshnessBudgetMs - (performance.now() - result.startedAt);
          if (serial !== transactionSerial || remainingFreshnessMs <= 0) {
            revokeObjectUrls(result.objectUrls);
            if (serial === transactionSerial) clearLive("Unavailable: decision_expired");
            return;
          }
          clearDisplayExpiry();
          revokeObjectUrls(currentObjectUrls);
          currentObjectUrls = result.objectUrls;
          displayedTransactionSerial = serial;
          liveRoot.replaceChildren(fragment);
          setStatus(result.payload.status === "partial" ? "Live partial: " + (result.payload.reason || "component_unavailable") : "Live accepted: shadow / observe-only", "live");
          displayExpiryTimer = setTimeout(() => {
            if (displayedTransactionSerial === serial) clearLive("Unavailable: decision_expired");
          }, Math.max(0, Math.floor(remainingFreshnessMs)));
        } catch (error) {
          if (serial !== transactionSerial) return;
          const reason = error && error.message === "timeout" ? "request_timeout" : ((error && error.message) || "decision_unavailable");
          clearLive("Unavailable: " + reason);
        } finally {
          if (serial === transactionSerial) pollTimer = setTimeout(poll, pollDelayMs);
        }
      }

      function schedulePoll() {
        if (pollTimer) clearTimeout(pollTimer);
        pollTimer = setTimeout(poll, pollDelayMs);
      }

      function readGeneration() {
        const params = new URLSearchParams(window.location.search);
        const values = params.getAll("generation");
        return values.length === 1 && generationPattern.test(values[0]) ? values[0] : null;
      }

      generation = readGeneration();
      if (!generation) {
        clearLive("Unavailable: exactly one lower-case generation query parameter is required.");
        return;
      }
      setStatus("Waiting for generation-bound shadow decision…", "error");
      window.addEventListener("offline", () => invalidate("Unavailable: network_disconnected"));
      window.addEventListener("online", schedulePoll);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") { wasHidden = true; return; }
        if (wasHidden) { wasHidden = false; invalidate("Unavailable: tab_resumed; awaiting a fresh accepted response"); schedulePoll(); }
      });
      poll();
    })();
  </script>
</body>
</html>
