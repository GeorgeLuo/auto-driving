name: Deterministic tests

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, review_requested]
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTOMA_TEST_LIVE_SIM: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch sealed historical source
        run: |
          git fetch --no-tags origin \
            7931fa9a995af5626fabef818f9e28b98c73e299
          git cat-file -e \
            7931fa9a995af5626fabef818f9e28b98c73e299^{commit}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            docs/requirements.txt

      - name: Install test dependencies
        run: python3 -m pip install -r requirements-test.txt -r docs/requirements.txt

      - name: Validate milestone planning state
        run: |
          python3 docs/milestones/workflow.py validate
          python3 docs/render_markdown.py --check

      - name: Validate proposal and implementation phase
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 docs/milestones/workflow.py validate-pr \
            --base-ref "${{ github.base_ref }}" \
            --head-ref "${{ github.head_ref }}" \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --event-path "$GITHUB_EVENT_PATH"

      - name: Run deterministic tests with coverage
        run: |
          python3 -m coverage run tests/run.py
          python3 -m coverage combine

      - name: Publish informational coverage
        run: |
          python3 -m coverage report
          python3 -m coverage report --format=markdown --skip-covered >> "$GITHUB_STEP_SUMMARY"
