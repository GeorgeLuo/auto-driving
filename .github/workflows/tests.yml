name: Deterministic tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTOMA_TEST_LIVE_SIM: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch sealed historical sources
        run: |
          git fetch --no-tags origin \
            7931fa9a995af5626fabef818f9e28b98c73e299 \
            a989324470e6fc04c9d9678e2337daf47828100b
          git cat-file -e \
            7931fa9a995af5626fabef818f9e28b98c73e299^{commit}
          git cat-file -e \
            a989324470e6fc04c9d9678e2337daf47828100b^{commit}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            docs/requirements.txt

      - name: Install test dependencies
        run: python3 -m pip install -r requirements-test.txt -r docs/requirements.txt

      - name: Check generated documentation
        run: python3 docs/render_markdown.py --check

      # Parked delivery gates (workflow.py validate / validate-pr). Restore
      # from docs/deprecated/milestones/workflow.py only if that process is
      # brought back. They are not part of the default path.

      - name: Run deterministic tests with coverage
        run: |
          python3 -m coverage run tests/run.py
          python3 -m coverage combine

      - name: Publish informational coverage
        run: |
          python3 -m coverage report
          python3 -m coverage report --format=markdown --skip-covered >> "$GITHUB_STEP_SUMMARY"
