<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Automa</title>
  <link rel="stylesheet" href="/static/shared/float.css">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
      --bg: #0a0a0a;
      --fg: #ededed;
      --muted: #8c8c8c;
      --line: rgba(255, 255, 255, 0.14);
      --green: #3ecf8e;
      --red: #ef6b6b;
    }
    body { margin: 0; background: var(--bg); letter-spacing: -0.01em; }
    main { max-width: 280px; margin: 18vh auto; padding: 16px; }
    .identity {
      display: flex;
      align-items: center;
      gap: 4px;
      margin: 0 0 14px;
    }
    h1 { margin: 0; font-size: 13px; font-weight: 500; }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex: 0 0 auto;
      transform: translateY(2px);
    }
    .status-dot.live { background: var(--green); }
    .status-dot.error { background: var(--red); }
    nav { display: grid; gap: 8px; }
    .nav {
      display: block;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--muted);
      background: transparent;
      font-size: 12px;
      text-decoration: none;
    }
    button.nav {
      width: 100%;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
    }
    a.nav:hover, a.nav:focus-visible, button.nav:hover, button.nav:focus-visible {
      background: rgba(255, 255, 255, 0.06);
      color: var(--fg);
    }
    button.nav[aria-pressed="true"] { color: var(--fg); }
    span.nav.unavailable { color: #6a6a6a; cursor: default; }
    .host-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 0;
      color: var(--muted);
      line-height: 1.35;
    }
    .host-note { margin: 0; color: var(--muted); line-height: 1.35; }
  </style>
</head>
<body>
  <main>
    <div class="identity">
      <h1>Automa</h1>
      __CONNECTION_DOT__
    </div>
    <nav aria-label="Runtime views">
      <button type="button" class="nav" data-recall="connectFrame">Connect</button>
      __RUNTIME_NAV__
    </nav>
  </main>
  <div id="floatLayer">
    <article class="float-frame" id="connectFrame" data-frame-anchor="center" data-frame-width="320" data-frame-height="220" data-frame-start="closed" hidden>
      <div class="float-frame-header" data-frame-header>
        <div class="float-frame-title">
          <span class="grip" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="1"></circle><circle cx="9" cy="12" r="1"></circle><circle cx="9" cy="17" r="1"></circle><circle cx="15" cy="7" r="1"></circle><circle cx="15" cy="12" r="1"></circle><circle cx="15" cy="17" r="1"></circle></svg>
          </span>
          <strong>Connect</strong>
        </div>
        <div class="float-frame-controls">
          <button type="button" class="icon-btn" data-frame-close aria-label="Close Connect" title="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
          <button type="button" class="icon-btn" data-frame-minimize aria-label="Minimize Connect" title="Minimize"></button>
        </div>
      </div>
      <div class="float-frame-body" data-frame-body></div>
      <section class="float-frame-status">
        <p class="float-frame-status-text" role="status"></p>
        <div class="float-frame-status-actions"></div>
      </section>
    </article>
  </div>
  <script src="/static/shared/float.js"></script>
  <script>
    // The Connect window lists the runtime hosts each time it opens.
    const connectFrame = document.getElementById("connectFrame");
    const hostList = connectFrame.querySelector("[data-frame-body]");
    let hostsTicket = 0;

    function showHostNote(text) {
      const note = document.createElement("p");
      note.className = "host-note";
      note.textContent = text;
      hostList.replaceChildren(note);
    }

    function hostRow(host) {
      const row = document.createElement("div");
      row.className = "host-row";
      const name = document.createElement("span");
      name.textContent = host.host_name;
      const state = document.createElement("span");
      state.textContent = host.state || "";
      row.append(name, state);
      return row;
    }

    async function loadHosts() {
      const ticket = ++hostsTicket;
      showHostNote("Looking for hosts…");
      try {
        const response = await fetch("/api/hosts", { cache: "no-store" });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
        if (ticket !== hostsTicket) return;
        if (payload.hosts.length === 0) showHostNote("No hosts found");
        else hostList.replaceChildren(...payload.hosts.map(hostRow));
      } catch (error) {
        if (ticket === hostsTicket) showHostNote(`Could not list hosts: ${error.message}`);
      }
    }

    connectFrame.addEventListener("frame-open", loadHosts);
    if (!connectFrame.hidden) loadHosts();
  </script>
</body>
</html>
