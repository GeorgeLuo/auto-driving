    function paintStream(s) {
      if (s.host && !state.hosts.some((h) => h.name === s.host)) Object.assign(s, { host: null, step: null, context: "feeds" });
      const h = state.hosts.find((x) => x.name === s.host);
      const streaming = s.context === "stream";
      const live = streaming && !!h && (h.state === "running" || h.decisions > 0) && CAPTURE.length > 0;
      const perception = streaming && s.step === "perception";
      s.root.dataset.context = s.context;
      s.root.querySelector("[data-plugins]").disabled = !streaming || !h || state.windows.plugins.busy;

                      ["Frame", frame ? frame.frame.frame_id : "—"], ["Run", st ? st.run_id : "—"],
                      ["Generation", st ? st.generation_id : "—"], ["Cycle", st ? `${st.cycle_ms} ms` : "—"]];
        while (meta.children.length < rows.length * 2) meta.append(document.createElement("dt"), document.createElement("dd"));
        rows.forEach(([name, value], i) => {
          meta.children[2 * i].textContent = name;
          meta.children[2 * i + 1].textContent = meta.children[2 * i + 1].title = value;
        });
      }
      if (perception) paintFeed(s, h, live);
      else {
        s.shown = null;
        s.root.querySelector("[data-pause]").hidden = true;
      }
    }
    $("streamOpen").addEventListener("click", () => openStream());

    // ---- The column's readouts. ----
    function paintColumn() {
      const listed = state.vehicles.filter(listedVehicle);
      $("vehiclesReadout").textContent = `${listed.filter(takesHost).length}/${listed.length} up`;
      $("hostsReadout").textContent = `${state.hosts.length} host${state.hosts.length === 1 ? "" : "s"}`;
      $("pluginsReadout").textContent = pluginsHost() ? pluginsHost().name : "packaged";
      $("streamReadout").textContent = streams.length ? `${streams.length} open` : "";
      $("simulatorsReadout").textContent = created().length ? `${created().length} created` : "none";
    }
    function render() {
      fillVehicleSelect();
      windows.forEach(paint);
      for (const s of streams) { paint(s.w); paintStream(s); }
      paintColumn();
    }

    setInterval(() => {
      for (const host of state.hosts) {
        if (host.state !== "running") continue;
        host.decisions += 1;
        if (host.count && host.decisions >= host.count) { host.state = "finished run"; host.mode = null; }
      }
      render();
    }, ms(250) || 25);

    $("workbenchLink").addEventListener("click", (event) => event.preventDefault());
    $("gapList").innerHTML = GAP_KEYS.map((key, i) => `<p class="gap-item"><b>${i + 1}</b><span>${GAPS[key]}</span></p>`).join("");
    document.querySelectorAll("[data-gap]").forEach((el) => setGap(el, el.dataset.gap));
    $("endProcess").addEventListener("click", endProcess);
    $("gapsToggle").addEventListener("click", () => {
      const on = !document.body.classList.contains("show-gaps");
      document.body.classList.toggle("show-gaps", on);
      $("gapsToggle").setAttribute("aria-pressed", String(on));
      if (window.floatingFrames) (on ? floatingFrames.gapsFrame.restore() : floatingFrames.gapsFrame.close());
    });

    // Every load: all windows closed, commands left of the column, steps right of it, never over it.
    (function seedLayout() {
      // Every window opens a third of the page tall and twice as wide as tall; any can be resized.
      // Two stacks of three beside the column: the left in flow order (Simulators, Vehicles,
      // Hosts), the right Plugins, with Stream windows opening below it.
      const col = document.querySelector("main").getBoundingClientRect();
      const gap = 16, h = Math.round(window.innerHeight / 3), w = 2 * h;
      const left = Math.max(8, col.left - gap - w);
      const right = Math.min(Math.max(8, window.innerWidth - w - 8), col.right + gap);
      const slot = (i) => i * h;
      const layout = {
        simulatorsFrame: [left, slot(0), w, h], vehiclesFrame: [left, slot(1), w, h], hostsFrame: [left, slot(2), w, h],
        pluginsFrame: [right, slot(0), w, h],  // Stream windows open below it, each a step down
        gapsFrame: [Math.max(8, (window.innerWidth - w) / 2), window.innerHeight - h - 44, w, h],  // above the mock controls
      };
      for (const [id, [x, y, w, h]] of Object.entries(layout)) {
        const key = `automa-float-${id}`;
        localStorage.setItem(key, JSON.stringify({ position: { x, y }, size: { width: w, height: h }, minimized: false, closed: true }));
      }
    })();
  </script>
  <script src="../shared/float.js"></script>
  <script>render();</script>
</body>
</html>
