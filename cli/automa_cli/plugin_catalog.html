<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plugins · Automa</title>
<style>
  :root {
    color-scheme: dark;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0a0a0a;
    color: #ededed;
    --muted: #8c8c8c;
    --line: rgba(255, 255, 255, 0.14);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  body { margin: 0; background: #0a0a0a; letter-spacing: -0.01em; }
  main { max-width: 960px; margin: 28px auto; padding: 16px; }
  a.nav {
    display: inline-flex;
    align-items: center;
    min-height: 24px;
    margin-bottom: 16px;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 3px 8px;
    color: var(--muted);
    font-size: 11px;
    text-decoration: none;
  }
  a.nav:hover { background: rgba(255, 255, 255, 0.05); color: #ededed; }
  h1 { margin: 0 0 10px; font-size: 13px; font-weight: 500; }
  #status { margin: 0; color: var(--muted); font-family: var(--mono); font-size: 12px; }
  table { width: 100%; margin-top: 14px; text-align: left; border-collapse: collapse; }
  th, td { padding: 7px 8px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  th { color: var(--muted); font-size: 11px; font-weight: 500; }
  td { color: #ededed; font-family: var(--mono); font-size: 12px; }
  td:nth-child(-n + 2) { color: var(--muted); font-family: inherit; }
</style>
<main>
  <a class="nav" href="/">Automa</a>
  <h1>Plugins</h1>
  <p id="status" role="status">Loading catalog…</p>
  <table><thead><tr><th>Step</th><th>Plugin</th><th>Available revision</th><th>Requested revision</th><th>Applied revision</th><th>Source</th></tr></thead>
    <tbody id="plugins"></tbody></table>
</main>
<script>
  async function refresh() {
    try {
      const response = await fetch('/api/plugins');
      const catalog = await response.json();
      if (!catalog.ok) throw new Error(catalog.error);
      const arming = catalog.arming;
      document.getElementById('status').textContent = 'Catalog ' + catalog.catalog_version +
        (arming ? ' · Arming: ' + arming.status + (arming.error ? ' · ' + arming.error : '') : '');
      function selectedRevision(name, plugin) {
        const selected = arming?.[name]?.[plugin.step]?.find(item => item.id === plugin.id);
        return selected ? selected.metadata.revision || 'packaged' : '—';
      }
      const rows = catalog.plugins.map(plugin => {
        const row = document.createElement('tr');
        const metadata = plugin.metadata || {};
        [plugin.step, plugin.id, metadata.revision || 'packaged', selectedRevision('requested', plugin),
          selectedRevision('applied', plugin), metadata.filename || plugin.entrypoint].forEach(value => {
          const cell = document.createElement('td'); cell.textContent = value; row.appendChild(cell);
        });
        return row;
      });
      document.getElementById('plugins').replaceChildren(...rows);
    } catch (error) { document.getElementById('status').textContent = error.message; }
    setTimeout(refresh, 500);
  }
  refresh();
</script>
</html>
