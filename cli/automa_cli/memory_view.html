<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Automa Memory Map</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      letter-spacing: -0.01em;
      --bg: #0a0a0a;
      --fg: #ededed;
      --muted: #8c8c8c;
      --line: rgba(255, 255, 255, 0.14);
      --green: #3ecf8e;
      --amber: #e6b325;
      --red: #ef6b6b;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
    }
    header {
      min-height: 40px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .identity, .runtime-status { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .product { font-size: 13px; font-weight: 500; white-space: nowrap; }
    .vehicle, #statusText {
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .vehicle { font-family: var(--mono); }
    .status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--amber); flex: 0 0 auto;
    }
    .status-dot.live { background: var(--green); }
    .status-dot.stale { background: var(--amber); }
    .status-dot.error { background: var(--red); }
    button, a.nav, span.nav {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 3px 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      font-size: 11px;
      line-height: 1.35;
      text-decoration: none;
    }
    button:hover, a.nav:hover, a.nav:focus-visible {
      background: rgba(255, 255, 255, 0.05);
      color: var(--fg);
    }
    span.nav, span.nav.unavailable { cursor: default; color: #6a6a6a; }
    button:focus-visible, a.nav:focus-visible {
      outline: 1px solid rgba(255, 255, 255, 0.45);
      outline-offset: 1px;
    }
    main {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(260px, 22rem) minmax(0, 1fr);
    }
    .keys-panel, .value-panel {
      min-height: 0;
      overflow: auto;
      padding: 10px 12px;
      background: var(--bg);
    }
    .keys-panel { border-right: 1px solid var(--line); }
    h2 {
      margin: 16px 0 8px;
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(140, 140, 140, 0.9);
    }
    .keys-panel h2:first-child, .value-panel h2:first-child { margin-top: 0; }
    .metrics, .value-grid {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 5px 16px;
      margin: 0 0 4px;
      font-size: 12px;
    }
    .metrics dt, .value-grid dt { color: var(--muted); }
    .metrics dd, .value-grid dd {
      margin: 0;
      color: var(--fg);
      font-family: var(--mono);
      font-size: 12px;
      text-align: right;
      overflow-wrap: anywhere;
    }
    .kind-map {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 4px;
    }
    .kind-chip {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
    }
    .kind-chip button {
      all: unset;
      display: block;
      cursor: pointer;
      padding: 3px 8px;
      font: inherit;
      font-size: 11px;
      line-height: 1.35;
    }
    .kind-chip button:hover { background: transparent; color: inherit; }
    .kind-chip:hover { color: var(--fg); }
    .kind-chip.active {
      border-color: rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.06);
      color: var(--fg);
    }
    .key-list, .plugin-list { display: grid; gap: 6px; }
    .plugin-list { margin-bottom: 4px; }
    button.key-row {
      display: grid;
      gap: 2px;
      width: 100%;
      min-height: 0;
      padding: 6px 8px;
      text-align: left;
      justify-items: start;
    }
    button.key-row:hover { color: var(--fg); }
    button.key-row.selected {
      border-color: rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.06);
      color: var(--fg);
    }
    .key-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .key-id {
      font-family: var(--mono);
      font-size: 12px;
      word-break: break-all;
      font-weight: 450;
      color: inherit;
    }
    .key-meta { color: var(--muted); font-size: 11px; }
    .empty { color: var(--muted); font-size: 12px; padding: 8px 0; }
    .value-header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px 10px;
      margin: 0 0 12px;
    }
    .value-arrow { color: var(--muted); }
    .value-title {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 500;
      color: var(--fg);
      word-break: break-all;
    }
    .value-kind {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 11px;
      color: var(--muted);
      background: transparent;
    }
    pre {
      margin: 12px 0 0;
      padding: 8px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #111111;
      color: var(--fg);
      font: 11px/1.45 var(--mono);
      max-height: calc(100vh - 280px);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    @media (max-width: 820px) {
      body { height: auto; display: block; }
      header { align-items: flex-start; }
      .runtime-status { flex-wrap: wrap; justify-content: flex-end; }
      main { grid-template-columns: 1fr; height: auto; }
      .keys-panel { border-right: 0; border-bottom: 1px solid var(--line); max-height: 45vh; }
    }
  </style>
</head>
<body>
  <header>
    <div class="identity">
      <span class="product">Memory</span>
      <span class="vehicle" id="vehicle">waiting</span>
    </div>
    <div class="runtime-status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Connecting</span>
      <a class="nav" href="/">Automa</a>
      <a class="nav" href="/perception">Perception</a>
      __DECISION_NAV__
      <button type="button" id="pauseButton">Pause</button>
    </div>
  </header>

  <main>
    <section class="keys-panel" aria-label="Memory keys">
      <h2>Plugins</h2>
      <div class="plugin-list" id="pluginList"></div>
      <h2>Ledger</h2>
      <dl class="metrics" id="ledgerMetrics"></dl>
      <h2>Kind</h2>
      <div class="kind-map" id="kindMap"></div>
      <h2>Keys</h2>
      <div class="key-list" id="keyList"></div>
    </section>
    <section class="value-panel" aria-label="Mapped memory value">
      <h2>Value</h2>
      <div id="valueEmpty" class="empty"></div>
      <div id="valueBody" hidden>
        <div class="value-header">
          <span class="key-label">key</span>
          <div class="value-title" id="valueKey"></div>
          <span class="value-arrow">→</span>
          <span class="value-kind" id="valueKind">value</span>
        </div>
        <dl class="value-grid" id="valueSummary"></dl>
        <pre id="valueJson"></pre>
      </div>
    </section>
  </main>

  <script>
    const vehicleEl = document.getElementById("vehicle");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const pauseButton = document.getElementById("pauseButton");
    const pluginList = document.getElementById("pluginList");
    const ledgerMetrics = document.getElementById("ledgerMetrics");
    const kindMap = document.getElementById("kindMap");
    const keyList = document.getElementById("keyList");
    const valueEmpty = document.getElementById("valueEmpty");
    const valueBody = document.getElementById("valueBody");
    const valueKey = document.getElementById("valueKey");
    const valueKind = document.getElementById("valueKind");
    const valueSummary = document.getElementById("valueSummary");
    const valueJson = document.getElementById("valueJson");

    let latest = null;
    let selectedPluginId = null;
    let selectedKey = null;
    let kindFilter = null;
    let paused = false;
    let refreshing = false;
    let lastPluginsFingerprint = "";
    let lastKeysFingerprint = "";
    let lastKindsFingerprint = "";
    let lastMetricsFingerprint = "";
    let lastValueFingerprint = "";

    function setStatus(text, mode) {
      statusText.textContent = text;
      statusDot.className = `status-dot ${mode || ""}`;
    }

    function appendMetric(container, name, value) {
      const term = document.createElement("dt");
      term.textContent = name;
      const detail = document.createElement("dd");
      detail.textContent = value ?? "—";
      container.append(term, detail);
    }

    // The memory report lists every applied plugin by plugin_id and names the
    // evidence publisher. The page shows one plugin's ledger at a time: the
    // plugin the viewer picked, else the evidence publisher, else none.
    function memoryPlugins() {
      const list = latest?.memory?.plugins;
      return Array.isArray(list)
        ? list.filter((entry) => entry && typeof entry.plugin_id === "string")
        : [];
    }

    function evidencePublisher() {
      const publisher = latest?.memory?.evidence_publisher;
      return typeof publisher === "string" && publisher ? publisher : null;
    }

    function shownPlugin() {
      const wanted = selectedPluginId ?? evidencePublisher();
      return memoryPlugins().find((entry) => entry.plugin_id === wanted) || null;
    }

    function shownState() {
      const state = shownPlugin()?.state;
      return state && typeof state === "object" ? state : null;
    }

    function stateKeyCount(state) {
      return state?.record_count ?? (Array.isArray(state?.records) ? state.records.length : "?");
    }

    function records() {
      const list = shownState()?.records;
      return Array.isArray(list) ? list : [];
    }

    function recordMap() {
      const map = new Map();
      for (const record of records()) {
        const key = String(record.record_id || "");
        if (key) map.set(key, record);
      }
      return map;
    }

    function kindCounts() {
      const counts = new Map();
      for (const record of records()) {
        const kind = String(record.kind || "unknown");
        counts.set(kind, (counts.get(kind) || 0) + 1);
      }
      return [...counts.entries()].sort((a, b) => a[0].localeCompare(b[0]));
    }

    function filteredRecords() {
      const all = records().slice().sort((a, b) =>
        String(a.record_id || "").localeCompare(String(b.record_id || ""))
      );
      if (!kindFilter) return all;
      return all.filter((record) => String(record.kind || "unknown") === kindFilter);
    }

    function keyMetaText(record) {
      const zone = record.location?.zone;
      return [
        record.kind || "unknown",
        zone ? `zone:${zone}` : "no-location",
        `conf ${Number(record.confidence || 0).toFixed(2)}`,
      ].join(" · ");
    }

    function keysFingerprint(rows) {
      // Identity for list rebuild only. Confidence is excluded so live score
      // jitter does not destroy buttons mid-click.
      return rows.map((record) => {
        const zone = record.location?.zone || "";
        return `${record.record_id}\0${record.kind || ""}\0${zone}`;
      }).join("\n") + `\nfilter:${kindFilter || ""}\nplugin:${shownPlugin()?.plugin_id || ""}`;
    }

    function pluginMetaText(entry) {
      const state = entry.state && typeof entry.state === "object" ? entry.state : null;
      return [
        state?.health || "no health",
        `epoch ${state?.epoch_id || "—"}`,
        `${stateKeyCount(state)} keys`,
      ].join(" · ");
    }

    function selectPlugin(pluginId) {
      if (!pluginId || pluginId === shownPlugin()?.plugin_id) return;
      selectedPluginId = pluginId;
      selectedKey = null;
      kindFilter = null;
      lastPluginsFingerprint = "";
      lastKeysFingerprint = "";
      lastKindsFingerprint = "";
      lastMetricsFingerprint = "";
      lastValueFingerprint = "";
      renderLedger();
      renderStatus();
    }

    function renderPlugins() {
      const plugins = memoryPlugins();
      const publisher = evidencePublisher();
      const shown = shownPlugin()?.plugin_id || "";
      // Rebuild only when the plugin list, publisher or shown plugin changes;
      // otherwise patch the meta line so live counts do not replace buttons.
      const fingerprint = [publisher || "", shown, ...plugins.map((entry) => entry.plugin_id)].join("\0");
      if (fingerprint !== lastPluginsFingerprint) {
        lastPluginsFingerprint = fingerprint;
        const focusedPlugin = pluginList.contains(document.activeElement)
          ? document.activeElement.dataset.plugin : null;
        pluginList.replaceChildren();
        if (!plugins.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = latest?.memory ? "No memory plugins ran." : "No memory report in publication yet.";
          pluginList.append(empty);
          return;
        }
        for (const entry of plugins) {
          const selected = entry.plugin_id === shown;
          const button = document.createElement("button");
          button.type = "button";
          button.className = `key-row plugin-row${selected ? " selected" : ""}`;
          button.dataset.plugin = entry.plugin_id;
          button.setAttribute("aria-pressed", selected ? "true" : "false");
          const label = document.createElement("div");
          label.className = "key-label";
          label.textContent = entry.plugin_id === publisher ? "plugin · evidence publisher" : "plugin";
          const id = document.createElement("div");
          id.className = "key-id";
          id.textContent = entry.plugin_id;
          const meta = document.createElement("div");
          meta.className = "key-meta";
          button.append(label, id, meta);
          pluginList.append(button);
          if (entry.plugin_id === focusedPlugin) button.focus();
        }
      }
      const byId = new Map(plugins.map((entry) => [entry.plugin_id, entry]));
      for (const button of pluginList.querySelectorAll(".plugin-row")) {
        const entry = byId.get(button.dataset.plugin || "");
        const meta = button.querySelector(".key-meta");
        if (entry && meta) meta.textContent = pluginMetaText(entry);
      }
    }

    function selectKey(key) {
      if (!key || selectedKey === key) {
        // Re-apply highlight/value even if same key — handles race recovery.
        if (key) {
          selectedKey = key;
          syncSelectionStyles();
          renderValue(true);
        }
        return;
      }
      selectedKey = key;
      syncSelectionStyles();
      renderValue(true);
    }

    function syncSelectionStyles() {
      for (const button of keyList.querySelectorAll(".key-row")) {
        const key = button.dataset.key || "";
        const selected = key === selectedKey;
        button.classList.toggle("selected", selected);
        button.setAttribute("aria-pressed", selected ? "true" : "false");
      }
    }

    function patchKeyMeta(rows) {
      const byKey = new Map(rows.map((record) => [String(record.record_id), record]));
      for (const button of keyList.querySelectorAll(".key-row")) {
        const record = byKey.get(button.dataset.key || "");
        if (!record) continue;
        const meta = button.querySelector(".key-meta");
        if (meta) meta.textContent = keyMetaText(record);
      }
    }

    function renderKinds(force = false) {
      const counts = kindCounts();
      const fingerprint = `${kindFilter || ""}\0${records().length}\0` +
        counts.map(([kind, count]) => `${kind}:${count}`).join("|");
      if (!force && fingerprint === lastKindsFingerprint) return;
      lastKindsFingerprint = fingerprint;

      kindMap.replaceChildren();
      const allChip = document.createElement("span");
      allChip.className = `kind-chip ${kindFilter == null ? "active" : ""}`;
      const allBtn = document.createElement("button");
      allBtn.type = "button";
      allBtn.dataset.kind = "";
      allBtn.textContent = `all (${records().length})`;
      allChip.append(allBtn);
      kindMap.append(allChip);
      for (const [kind, count] of counts) {
        const chip = document.createElement("span");
        chip.className = `kind-chip ${kindFilter === kind ? "active" : ""}`;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.dataset.kind = kind;
        btn.textContent = `${kind} (${count})`;
        chip.append(btn);
        kindMap.append(chip);
      }
    }

    function renderMetrics() {
      const plugin = shownPlugin();
      const state = shownState();
      const publisher = evidencePublisher();
      const fingerprint = [
        latest?.vehicle_id || "",
        latest?.memory ? "report" : "absent",
        plugin?.plugin_id || "",
        publisher || "",
        state?.health || "",
        state?.epoch_id || "",
        stateKeyCount(state),
        state?.bounds?.max_records ?? "",
        state?.bounds?.max_age_ms ?? "",
      ].join("\0");
      if (fingerprint === lastMetricsFingerprint) return;
      lastMetricsFingerprint = fingerprint;

      vehicleEl.textContent = latest?.vehicle_id || "unknown vehicle";
      ledgerMetrics.replaceChildren();
      appendMetric(ledgerMetrics, "Plugin", plugin?.plugin_id || (latest?.memory ? "pick a plugin" : "—"));
      appendMetric(ledgerMetrics, "Health", state?.health || (plugin ? "no health" : "absent"));
      appendMetric(ledgerMetrics, "Epoch", state?.epoch_id || "—");
      appendMetric(
        ledgerMetrics,
        "Keys",
        plugin ? `${stateKeyCount(state)}/${state?.bounds?.max_records ?? "?"} filled` : "—"
      );
      appendMetric(ledgerMetrics, "Max age", state?.bounds?.max_age_ms != null ? `${state.bounds.max_age_ms} ms` : "—");
      appendMetric(ledgerMetrics, "Evidence publisher", publisher || (latest?.memory ? "none" : "—"));
    }

    function renderLedger() {
      // Keep the picked plugin across live updates; drop it only when a report
      // lists plugins and it is not among them.
      const plugins = memoryPlugins();
      if (selectedPluginId && plugins.length && !plugins.some((entry) => entry.plugin_id === selectedPluginId)) {
        selectedPluginId = null;
      }
      renderPlugins();
      const map = recordMap();
      // Keep selection across live updates; only drop it when the key truly left.
      if (selectedKey && map.size > 0 && !map.has(selectedKey)) {
        selectedKey = null;
        lastValueFingerprint = "";
      }
      renderMetrics();
      renderKinds();
      renderKeys();
      renderValue();
    }

    function renderKeys(force = false) {
      const rows = filteredRecords();
      const fingerprint = keysFingerprint(rows);
      if (!force && fingerprint === lastKeysFingerprint) {
        patchKeyMeta(rows);
        syncSelectionStyles();
        return;
      }
      lastKeysFingerprint = fingerprint;

      keyList.replaceChildren();
      if (!rows.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = !latest?.memory
          ? "No memory report in publication yet."
          : shownPlugin()
            ? "No keys in this filter."
            : "No evidence publisher. Pick a plugin above to see its keys.";
        keyList.append(empty);
        return;
      }

      for (const record of rows) {
        const key = String(record.record_id);
        const button = document.createElement("button");
        button.type = "button";
        button.className = "key-row";
        button.dataset.key = key;
        const label = document.createElement("div");
        label.className = "key-label";
        label.textContent = "key";
        const id = document.createElement("div");
        id.className = "key-id";
        id.textContent = key;
        const meta = document.createElement("div");
        meta.className = "key-meta";
        meta.textContent = keyMetaText(record);
        button.append(label, id, meta);
        keyList.append(button);
      }
      syncSelectionStyles();
    }

    function renderValue(force = false) {
      const map = recordMap();
      if (!selectedKey || !map.has(selectedKey)) {
        if (force || lastValueFingerprint !== "empty") {
          lastValueFingerprint = "empty";
          valueEmpty.hidden = false;
          valueBody.hidden = true;
          valueEmpty.textContent = latest?.memory ? "" : "Waiting";
        }
        return;
      }
      const value = map.get(selectedKey);
      const fingerprint = `${selectedKey}\0${JSON.stringify(value)}`;
      if (!force && fingerprint === lastValueFingerprint) return;
      lastValueFingerprint = fingerprint;

      valueEmpty.hidden = true;
      valueBody.hidden = false;
      valueKey.textContent = selectedKey;
      valueKind.textContent = value.kind || "retained evidence";
      valueSummary.replaceChildren();
      appendMetric(valueSummary, "kind", value.kind);
      appendMetric(valueSummary, "label", value.label);
      appendMetric(valueSummary, "confidence", Number(value.confidence || 0).toFixed(3));
      appendMetric(valueSummary, "location.frame", value.location?.frame || "—");
      appendMetric(valueSummary, "location.zone", value.location?.zone || "—");
      if (Array.isArray(value.location?.bbox_xyxy_norm)) {
        appendMetric(
          valueSummary,
          "location.bbox_xyxy_norm",
          value.location.bbox_xyxy_norm.map((n) => Number(n).toFixed(3)).join(", ")
        );
      }
      appendMetric(valueSummary, "origin.frame_id", value.origin?.frame_id || "—");
      appendMetric(valueSummary, "origin.observation_id", value.origin?.observation_id || "—");
      appendMetric(valueSummary, "origin.observed_id", value.origin?.observed_id || "—");
      appendMetric(valueSummary, "origin.updated_at_ms", value.origin?.updated_at_ms ?? "—");
      appendMetric(valueSummary, "source_plugin", value.origin?.source_plugin_id || "—");
      valueJson.textContent = JSON.stringify(value, null, 2);
    }

    function renderStatus() {
      if (!latest?.memory) {
        setStatus("Live | memory absent", "stale");
        return;
      }
      const plugin = shownPlugin();
      if (!plugin) {
        setStatus(`Live | ${memoryPlugins().length} plugins, no evidence publisher`, "stale");
        return;
      }
      const health = shownState()?.health;
      const name = plugin.plugin_id;
      if (health === "healthy") setStatus(`Live | ${name}: ${stateKeyCount(shownState())} keys`, "live");
      else if (health === "empty") setStatus(`Live | ${name}: empty map`, "stale");
      else setStatus(`Live | ${name}: ${health || "unknown"}`, health === "error" ? "error" : "stale");
    }

    // Stable parent handlers so selection survives DOM rebuild races.
    // pointerdown fires before refresh can replace the button under a click.
    function pickPlugin(event) {
      const button = event.target.closest(".plugin-row");
      if (!button || !pluginList.contains(button)) return;
      event.preventDefault();
      selectPlugin(button.dataset.plugin);
    }
    pluginList.addEventListener("pointerdown", pickPlugin);
    pluginList.addEventListener("click", (event) => {
      if (event.detail === 0) pickPlugin(event);
    });

    keyList.addEventListener("pointerdown", (event) => {
      const button = event.target.closest(".key-row");
      if (!button || !keyList.contains(button)) return;
      const key = button.dataset.key;
      if (!key) return;
      event.preventDefault();
      selectKey(key);
    });

    kindMap.addEventListener("pointerdown", (event) => {
      const button = event.target.closest("button[data-kind]");
      if (!button || !kindMap.contains(button)) return;
      event.preventDefault();
      const kind = button.dataset.kind || "";
      kindFilter = kind ? (kindFilter === kind ? null : kind) : null;
      lastKindsFingerprint = "";
      lastKeysFingerprint = "";
      renderKinds(true);
      renderKeys(true);
      renderValue();
    });

    async function refresh() {
      if (paused || refreshing) return;
      refreshing = true;
      try {
        const response = await fetch("/api/latest", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        latest = await response.json();
        renderLedger();
        renderStatus();
      } catch (error) {
        setStatus(`Waiting: ${error.message}`, "error");
      } finally {
        refreshing = false;
      }
    }

    pauseButton.addEventListener("click", () => {
      paused = !paused;
      pauseButton.textContent = paused ? "Resume" : "Pause";
      setStatus(paused ? "Paused" : "Live", paused ? "" : "live");
      if (!paused) refresh();
    });

    refresh();
    setInterval(refresh, 200);
  </script>
</body>
</html>
