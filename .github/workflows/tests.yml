name: Deterministic tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-quality.txt
      - run: python3 -m pip install -r requirements-quality.txt
      - name: Check quality and inspect changes
        run: python3 -m scripts.validation.check --output "$RUNNER_TEMP/quality"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-findings
          path: ${{ runner.temp }}/quality/
          retention-days: 14

  test:
    name: Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTOMA_TEST_LIVE_SIM: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            requirements-quality.txt

      - name: Install test dependencies
        run: python3 -m pip install -r requirements-test.txt

      - name: Run deterministic tests with coverage
        run: |
          python3 -m coverage run tests/run.py
          python3 -m coverage combine

      - name: Publish informational coverage
        run: |
          python3 -m coverage report
          python3 -m coverage report --format=markdown --skip-covered >> "$GITHUB_STEP_SUMMARY"
