<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Automa</title>
  <link rel="stylesheet" href="/static/float.css">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a0a0a;
      color: #ededed;
      --muted: #8c8c8c;
      --line: rgba(255, 255, 255, 0.14);
      --green: #3ecf8e;
      --red: #ef6b6b;
    }
    body { margin: 0; background: #0a0a0a; letter-spacing: -0.01em; }
    main { max-width: 280px; margin: 18vh auto; padding: 16px; }
    .identity {
      display: flex;
      align-items: center;
      gap: 4px;
      margin: 0 0 14px;
    }
    h1 { margin: 0; font-size: 13px; font-weight: 500; }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex: 0 0 auto;
      transform: translateY(2px);
    }
    .status-dot.live { background: var(--green); }
    .status-dot.error { background: var(--red); }
    nav { display: grid; gap: 8px; }
    nav > button, nav > a, .decision-unavailable {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--muted);
      background: transparent;
      font: inherit;
      font-size: 12px;
      line-height: 1.35;
      text-align: left;
      text-decoration: none;
      cursor: pointer;
    }
    nav > button:hover, nav > button:focus-visible, nav > a:hover, nav > a:focus-visible {
      background: rgba(255, 255, 255, 0.06);
      color: #ededed;
    }
    .decision-unavailable { color: #6a6a6a; cursor: default; }
    body.disconnected nav > a {
      color: #6a6a6a;
      pointer-events: none;
      cursor: default;
    }
    body.disconnected nav > a:hover, body.disconnected nav > a:focus-visible {
      background: transparent;
      color: #6a6a6a;
    }
    #connectFrame .env-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    #connectFrame .env-name {
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      line-height: 1.35;
      text-align: left;
      cursor: pointer;
    }
    #connectFrame .env-name:hover, #connectFrame .env-name:focus-visible {
      color: #ededed;
    }
    #connectFrame .env-error {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    #connectFrame.is-loading .float-frame-body { visibility: hidden; }
    #connectFrame .title-loading { white-space: nowrap; }
    #connectFrame .title-loading em { font-style: italic; }
    #connectFrame .float-frame-body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #connectFrame .env-list {
      flex: 0 1 auto;
      min-height: 0;
      overflow: auto;
    }
    #connectFrame .host-offer {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      margin-top: 12px;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    #connectFrame .host-message {
      margin: 0;
      min-height: 0;
      overflow: auto;
    }
    #connectFrame .host-create {
      flex: 0 0 auto;
      margin-top: auto;
      color: var(--muted);
      text-align: right;
      cursor: pointer;
    }
    #connectFrame .host-create[hidden] { display: none; }
    #connectFrame .host-create:hover, #connectFrame .host-create:focus-visible {
      color: #ededed;
    }
    #connectFrame .host-create.is-busy {
      color: #6a6a6a;
      pointer-events: none;
    }
  </style>
</head>
<body class="__HOST_CLASS__">
  <main>
    <div class="identity">
      <h1>Automa</h1>
      __HOST_STATUS__
    </div>
    <nav aria-label="Runtime views">
      <button type="button" data-recall="connectFrame">Connect</button>
      <a href="/perception">Perception</a>
      <a href="/memory">Memory</a>
      __DECISION_NAV__
      <a href="/plugins">Plugins</a>
    </nav>
  </main>
  <div id="floatLayer">
    <article class="float-frame" id="connectFrame" data-frame-anchor="center" data-frame-width="320" data-frame-height="220" data-frame-start="closed" hidden>
      <div class="float-frame-header" data-frame-header>
        <div class="float-frame-title">
          <span class="grip" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="1"></circle><circle cx="9" cy="12" r="1"></circle><circle cx="9" cy="17" r="1"></circle><circle cx="15" cy="7" r="1"></circle><circle cx="15" cy="12" r="1"></circle><circle cx="15" cy="17" r="1"></circle></svg>
          </span>
          <strong>Connect</strong>
          <span class="title-loading" hidden> <em>CONTENT LOADING</em>...</span>
        </div>
        <div class="float-frame-controls">
          <button type="button" class="icon-btn" data-frame-close aria-label="Close Connect" title="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
          <button type="button" class="icon-btn" data-frame-minimize aria-label="Minimize Connect" title="Minimize"></button>
        </div>
      </div>
      <div class="float-frame-body" data-frame-body>
        <div class="env-list"></div>
        <div class="host-offer">
          <p class="host-message"></p>
          <span class="host-create" hidden tabindex="0">create</span>
        </div>
      </div>
    </article>
  </div>
  <script src="/static/js/float.js"></script>
  <script>
    (function () {
      var button = document.querySelector("[data-recall='connectFrame']");
      var frame = document.getElementById("connectFrame");
      var body = frame.querySelector("[data-frame-body]");
      var list = body.querySelector(".env-list");
      var message = body.querySelector(".host-message");
      var create = body.querySelector(".host-create");
      var loadingTitle = frame.querySelector(".title-loading");
      var ticket = 0;
      var viewGeneration = 0;

      var messageGeneration = 0;

      function clearMessage() {
        messageGeneration += 1;
        message.textContent = "";
        create.hidden = true;
        create.classList.remove("is-busy");
      }

      function setLoading(on) {
        frame.classList.toggle("is-loading", on);
        loadingTitle.hidden = !on;
      }

      function setMessage(text, done) {
        var next = text || "";
        var generation = ++messageGeneration;
        function reveal() {
          if (generation !== messageGeneration) return;
          message.textContent = next;
          if (done) done();
        }
        if (!message.textContent || message.textContent === next) {
          reveal();
          return;
        }
        message.textContent = "";
        window.setTimeout(reveal, 40);
      }

      function activateCreate(event) {
        if (event.type === "keydown" && event.key !== "Enter" && event.key !== " ") return;
        if (event.type === "keydown") event.preventDefault();
        createHost(create.dataset.vehicleId);
      }
      create.addEventListener("click", activateCreate);
      create.addEventListener("keydown", activateCreate);

      function row(id, state) {
        var item = document.createElement("div");
        item.className = "env-row";
        var name = document.createElement("button");
        name.type = "button";
        name.className = "env-name";
        name.textContent = id;
        name.addEventListener("click", function () { connect(id); });
        item.appendChild(name);
        if (state) {
          var mark = document.createElement("span");
          mark.textContent = state;
          item.appendChild(mark);
        }
        return item;
      }

      function showError(text) {
        var line = document.createElement("p");
        line.className = "env-error";
        line.textContent = text;
        list.replaceChildren(line);
      }

      function showConnectError(text) {
        setMessage(text, function () {
          create.hidden = true;
          create.classList.remove("is-busy");
        });
      }

      function showHostOffer(id, text) {
        create.dataset.vehicleId = id;
        setMessage(text, function () {
          create.hidden = false;
          create.classList.remove("is-busy");
        });
      }

      function createHost(id) {
        if (!id || create.classList.contains("is-busy")) return;
        create.classList.add("is-busy");
        fetch("/host", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ vehicle_id: id })
        }).then(function (response) {
          return response.json().then(function (payload) {
            return { ok: response.ok, payload: payload };
          });
        }).then(function (result) {
          var payload = result.payload || {};
          if (result.ok && payload.ok) {
            setMessage("Host is running.", function () {
              create.hidden = true;
              create.classList.remove("is-busy");
            });
            return;
          }
          setMessage(payload.error || "the host did not start", function () {
            create.classList.remove("is-busy");
          });
        }).catch(function () {
          setMessage("the host did not start", function () {
            create.classList.remove("is-busy");
          });
        });
      }

      function connect(id) {
        var view = viewGeneration;
        fetch("/connect", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ vehicle_id: id })
        }).then(function (response) {
          return response.json().then(function (payload) {
            return { ok: response.ok, payload: payload };
          });
        }).then(function (result) {
          if (view !== viewGeneration) return;
          var payload = result.payload || {};
          if (result.ok && payload.ok) {
            window.location.reload();
            return;
          }
          var error = payload.error || "perception stream is not live";
          if (error.indexOf("No Chase host is running for ") === 0) {
            showHostOffer(id, error);
            return;
          }
          showConnectError(error);
        }).catch(function () {
          if (view !== viewGeneration) return;
          showConnectError("perception stream is not live");
        });
      }

      function render(payload) {
        var nodes = [];
        (payload.vehicles || []).forEach(function (card) {
          if (!card || !card.vehicle_id) return;
          var readiness = card.readiness || {};
          var state = readiness.status === "ready"
            ? "ready"
            : (readiness.blocking_layer || readiness.status || "");
          nodes.push(row(String(card.vehicle_id), state ? String(state) : ""));
        });
        (payload.other_local_deployments || []).forEach(function (item) {
          if (!item || !item.vehicle_id) return;
          nodes.push(row(String(item.vehicle_id), ""));
        });
        list.replaceChildren.apply(list, nodes);
      }

      function load() {
        var current = ++ticket;
        viewGeneration += 1;
        clearMessage();
        list.replaceChildren();
        setLoading(true);
        fetch("/connect").then(function (response) {
          return response.json().then(function (payload) {
            return { ok: response.ok, payload: payload };
          });
        }).then(function (result) {
          if (current !== ticket) return;
          var payload = result.payload || {};
          if (!result.ok || payload.schema !== "automa_vehicle_status_v1") {
            showError(payload.error || "vehicles status failed");
          } else {
            render(payload);
          }
          setLoading(false);
        }).catch(function () {
          if (current !== ticket) return;
          showError("vehicles status failed");
          setLoading(false);
        });
      }

      button.addEventListener("click", function () {
        if (frame.hidden || frame.getAttribute("data-minimized") === "true") return;
        load();
      });
      if (!frame.hidden && frame.getAttribute("data-minimized") !== "true") load();
    })();
  </script>
</body>
</html>
