<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plugins · Automa</title>
<style>
  :root {
    color-scheme: dark;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0a0a0a;
    color: #ededed;
    --muted: #8c8c8c;
    --line: rgba(255, 255, 255, 0.14);
    --green: #3ecf8e;
    --amber: #e6b325;
    --red: #ef6b6b;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  body { margin: 0; background: #0a0a0a; letter-spacing: -0.01em; }
  main { max-width: 1200px; margin: 28px auto; padding: 16px; }
  a.nav {
    display: inline-flex;
    align-items: center;
    min-height: 24px;
    margin-bottom: 16px;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 3px 8px;
    color: var(--muted);
    font-size: 11px;
    text-decoration: none;
  }
  a.nav:hover { background: rgba(255, 255, 255, 0.05); color: #ededed; }
  .heading { display: flex; align-items: center; justify-content: space-between; }
  h1 { margin: 0; font-size: 13px; font-weight: 500; }
  .revision-toggle { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; cursor: pointer; }
  .revision-toggle:hover { color: #ededed; }
  #status { margin: 0; color: var(--red); font-size: 12px; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; min-width: 790px; margin-top: 14px; text-align: left; border-collapse: collapse; table-layout: fixed; }
  table.show-revisions { min-width: 1120px; }
  table:not(.show-revisions) .revision { display: none; }
  col.step { width: 100px; }
  col.plugin { width: 230px; }
  col.enabled { width: 72px; }
  col.origin { width: 90px; }
  col.revision { width: 110px; }
  th, td { padding: 7px 8px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  th { color: var(--muted); font-size: 11px; font-weight: 500; }
  td { color: #ededed; font-family: var(--mono); font-size: 12px; }
  table.stale tbody { opacity: 0.6; }
  td.enabled { font-family: inherit; white-space: nowrap; }
  .status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--amber); }
  .status-dot.live { background: var(--green); }
  .status-dot.error { background: var(--red); }
  td:nth-child(1), td:nth-child(4) { white-space: nowrap; }
  td:nth-child(-n + 2) { color: var(--muted); font-family: inherit; }
</style>
<main>
  <a class="nav" href="/">Automa</a>
  <div class="heading"><h1>Plugins</h1><label class="revision-toggle"><input type="checkbox" id="revisions" aria-controls="catalog">Show revisions</label></div>
  <p id="status" role="alert" hidden></p>
  <div class="table-scroll"><table id="catalog">
    <colgroup><col class="step"><col class="plugin"><col class="enabled"><col class="origin"><col class="revision"><col class="revision"><col class="revision"><col></colgroup>
    <thead><tr><th>Step</th><th>Plugin</th><th>Enabled</th><th>Origin</th><th class="revision">Available revision</th><th class="revision">Requested revision</th><th class="revision">Applied revision</th><th>Source</th></tr></thead>
    <tbody id="plugins"></tbody></table></div>
</main>
<script src="/plugin_feed.js"></script>
<script>
  document.getElementById('revisions').onchange = function () {
    document.getElementById('catalog').classList.toggle('show-revisions', this.checked);
  };
  function enabledDot(state) {
    const dot = document.createElement('span');
    dot.className = 'status-dot' + (state === 'Enabled' ? ' live' : state === 'Disabled' ? ' error' : '');
    dot.role = 'img';
    dot.ariaLabel = state;
    dot.title = state;
    return dot;
  }
  function render(catalog) {
    const arming = catalog.arming;
    function selectedRevision(name, plugin) {
      const selected = arming?.[name]?.[plugin.step]?.find(item => item.id === plugin.id);
      return selected ? selected.metadata?.revision || 'packaged' : '—';
    }
    const rows = catalog.plugins.map(plugin => {
      const row = document.createElement('tr');
      const metadata = plugin.metadata || {};
      const applied = appliedPlugins(catalog, plugin.step);
      const enabled = applied
        ? (applied.some(item => item.id === plugin.id) ? 'Enabled' : 'Disabled')
        : 'Unknown';
      row.dataset.step = plugin.step;
      row.dataset.pluginId = plugin.id;
      [plugin.step, plugin.id, enabled, metadata.revision ? 'uploaded' : 'packaged',
        metadata.revision || 'packaged', selectedRevision('requested', plugin),
        selectedRevision('applied', plugin), metadata.filename || plugin.entrypoint].forEach((value, index) => {
        const cell = document.createElement('td');
        if (index === 2) {
          cell.className = 'enabled';
          cell.appendChild(enabledDot(value));
        } else {
          if (index >= 4 && index <= 6) cell.className = 'revision';
          cell.textContent = value;
        }
        row.appendChild(cell);
      });
      return row;
    });
    document.getElementById('plugins').replaceChildren(...rows);
  }
  function markStale() {
    const table = document.getElementById('catalog');
    for (const cell of table.querySelectorAll('td.enabled')) cell.replaceChildren(enabledDot('Unknown'));
    return document.getElementById('plugins').children.length > 0;
  }
  followPluginCatalog({
    view: document.getElementById('catalog'), status: document.getElementById('status'), render, markStale,
  });
</script>
</html>
